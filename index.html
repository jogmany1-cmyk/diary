/* ==================================================================
   음성 STEP 3 — 한국어 파서 + 의도 해석
   ------------------------------------------------------------------
   · 저장은 하지 않는다. 기존 입력폼을 채워 두고 사용자가 저장 버튼을 누른다.
   · 분류는 기존 guessCat / autoCat, 카드는 finCardMatch, 차량은 CARKINDS 재사용.
   · 기존 xNum · Excel 파서는 건드리지 않는다. 음성 전용 파서를 따로 둔다.
   ================================================================== */

/* ---------- 숫자 ---------- */
const KSINO={'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'륙':6,'칠':7,'팔':8,'구':9};
const KUNIT={'십':10,'백':100,'천':1000};
const KBIG={'만':10000,'억':100000000,'조':1000000000000};
const KNAT={'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,
            '열':10,'열한':11,'열두':12};
const KCH='영공일이삼사오육륙칠팔구십백천만억조';
function reEsc(s){return String(s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

/* '십이만삼천오백' · '12만3천5백' · '1억2천만' → 숫자 */
function krNum(str){
 let s=String(str==null?'':str).replace(/[\s,]/g,'');
 if(!s)return null;
 if(/^\d+$/.test(s))return +s;
 if(!new RegExp('['+KCH+'\\d]').test(s))return null;
 let total=0, sec=0, num=0, seen=false;
 for(let i=0;i<s.length;i++){
  const c=s[i];
  if(/\d/.test(c)){let d='';while(i<s.length&&/\d/.test(s[i])){d+=s[i];i++}i--;num=+d;seen=true;continue}
  if(KSINO[c]!==undefined){num=KSINO[c];seen=true;continue}
  if(KUNIT[c]!==undefined){sec+=(num||1)*KUNIT[c];num=0;seen=true;continue}
  if(KBIG[c]!==undefined){sec+=num;total+=(sec||1)*KBIG[c];sec=0;num=0;seen=true;continue}
  return null;                        /* 숫자가 아닌 글자가 섞이면 포기 */
 }
 if(!seen)return null;
 return total+sec+num;
}
/* 문장에서 금액을 찾아낸다 (음성 전용) */
function krWon(text){
 const s=String(text==null?'':text).replace(/,/g,'');
 /* 뒤에 한글이 이어지면 '원피스' 같은 낱말이므로 금액이 아니다 */
 /* 뒤 글자가 조사면 금액이 맞고 ('12만원에'), 다른 낱말이면 아니다 ('원피스') */
 const tailOK=(i)=>{const c=s.charAt(i);return !/[가-힣]/.test(c)||/[에을를이가은는도만과와랑으로써씩짜쯤어대]/.test(c)};
 let re1=new RegExp('(['+KCH+'\\d][ '+KCH+'\\d]*)\\s*원','g'), m;
 while((m=re1.exec(s))){
  if(!tailOK(m.index+m[0].length))continue;
  const v=krNum(m[1]); if(v!==null&&v>=10)return v;
 }
 /* '1억' 처럼 원 없이 말한 경우 — 반드시 숫자로 시작해야 낱말 오인식을 막는다 */
 const re2=new RegExp('(\\d[ '+KCH+'\\d]*)\\s*([만억조])([ '+KCH+'\\d]*)','g');
 while((m=re2.exec(s))){
  if(!tailOK(m.index+m[0].length))continue;
  const v=krNum((m[1]+m[2]+m[3]).replace(/\s/g,'')); if(v!==null&&v>=10)return v;
 }
 /* 마지막 수단 : 세 자리 이상 숫자. 단 주행거리 문맥은 제외한다 */
 const re=/(\d{3,})(\s*(?:km|킬로|키로|킬로미터))?/gi; let g;
 while((g=re.exec(s))){
  if(g[2])continue;
  const pre=s.slice(Math.max(0,g.index-8),g.index);
  if(/주행\s*거리|계기판|현재\s*주행/.test(pre))continue;
  return +g[1];
 }
 return null;
}

/* ---------- 날짜 ---------- */
const KDOW={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function krDate(text,base){
 const b=base||today();
 const s=String(text==null?'':text);
 if(/그저께|그제/.test(s))return addD(b,-2);
 if(/내일\s*모레|모레/.test(s))return addD(b,2);
 if(/어제|어저께/.test(s))return addD(b,-1);
 if(/내일/.test(s))return addD(b,1);
 if(/오늘|방금|아까/.test(s))return b;
 let m=s.match(/(\d+)\s*일\s*(전|뒤|후)/);
 if(m)return addD(b,(m[2]==='전'?-1:1)*(+m[1]));
 m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
 if(m){
  const d0=parse(b), y=d0.getFullYear();
  let d=new Date(y,+m[1]-1,+m[2]);
  if(isNaN(d))return null;
  if(d-d0>200*864e5)d=new Date(y-1,+m[1]-1,+m[2]);
  if(d0-d>200*864e5)d=new Date(y+1,+m[1]-1,+m[2]);
  return key(d);
 }
 m=s.match(/(이번\s*주|다음\s*주|담\s*주|저번\s*주|지난\s*주)?\s*([월화수목금토일])\s*요일/);
 if(m){
  const want=KDOW[m[2]], cur0=parse(b).getDay();
  let diff=(want-cur0+7)%7;
  const w=(m[1]||'').replace(/\s/g,'');
  if(w==='다음주'||w==='담주')diff+=7;
  else if(w==='저번주'||w==='지난주')diff-=7;
  else if(!w&&diff===0)diff=0;
  return addD(b,diff);
 }
 return null;
}
/* ---------- 시간 ---------- */
function krTime(text){
 const s=String(text==null?'':text);
 let ampm=null;
 if(/오전|아침|새벽/.test(s))ampm='am';
 if(/오후|저녁|밤|점심/.test(s))ampm='pm';
 let h=null,mi=0;
 let m=s.match(/(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?/);
 if(m){h=+m[1];if(m[2])mi=+m[2];else if(m[3])mi=30}
 if(h===null){
  const ks=Object.keys(KNAT).sort((a,b)=>b.length-a.length).join('|');
  const km=s.match(new RegExp('('+ks+')\\s*시\\s*(?:(\\d{1,2})\\s*분|(반))?'));
  if(km){h=KNAT[km[1]];if(km[2])mi=+km[2];else if(km[3])mi=30}
 }
 if(h===null){const hm=s.match(/(\d{1,2}):(\d{2})/);if(hm){h=+hm[1];mi=+hm[2]}}
 if(h===null)return null;
 if(ampm==='pm'&&h<12)h+=12;
 if(ampm==='am'&&h===12)h=0;
 if(/새벽/.test(s)&&h>=12)h-=12;
 if(h<0||h>23||mi<0||mi>59)return null;
 return pad(h)+':'+pad(mi);
}
/* ---------- 사람 ---------- */
function krWho(text){
 const s=String(text==null?'':text);
 const R={by:'',sc:''};
 if(/우리|같이|둘이|함께/.test(s))R.sc='our';
 const me=S.names.me||'', you=S.names.you||'';
 if(you&&s.indexOf(you)>=0)R.by='you';
 else if(me&&s.indexOf(me)>=0)R.by='me';
 else if(/내가|제가|나는|나도|내\s/.test(s))R.by='me';
 return R;
}
/* ---------- 차량 ---------- */
function carByName(text){
 const s=catNorm(text||''); if(!s)return null;
 try{
  const L=cars();
  return L.find(c=>{const n=catNorm(carName(c));return n&&n.length>=2&&s.indexOf(n)>=0})||null;
 }catch(_){return null}
}

/* ---------- 문장에서 군더더기 제거 ---------- */
function voiceStrip(s){
 let t=String(s==null?'':s);
 t=t.replace(/그저께|그제|내일\s*모레|모레|어제|어저께|내일|오늘|방금|아까/g,' ');
 t=t.replace(/(이번|다음|담|저번|지난)\s*주/g,' ').replace(/[월화수목금토일]\s*요일/g,' ');
 t=t.replace(/(\d+)\s*일\s*(전|뒤|후)/g,' ');
 t=t.replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g,' ');
 t=t.replace(/오전|오후|아침|점심|저녁|밤|새벽/g,' ');
 const ks=Object.keys(KNAT).sort((a,b)=>b.length-a.length).join('|');
 t=t.replace(new RegExp('(\\d{1,2}|'+ks+')\\s*시(\\s*\\d{1,2}\\s*분|\\s*반)?','g'),' ');
 [S.names.me,S.names.you].filter(Boolean).forEach(n=>{
  t=t.replace(new RegExp(reEsc(n)+'(가|이|는|은|와|랑|과|한테|에게|님)?','g'),' ');
 });
 t=t.replace(/내가|제가|나는|나도|우리|같이|둘이서|둘이|함께/g,' ');
 t=t.replace(/[가-힣A-Za-z]{1,8}카드(로|으로)?/g,' ');
 t=t.replace(/현금(으로|로)?|계좌\s*이체|이체|송금/g,' ');
 t=t.replace(new RegExp('['+KCH+'\\d][ '+KCH+'\\d]*\\s*원','g'),' ');
 t=t.replace(new RegExp('['+KCH+'\\d]*[만억조][ '+KCH+'\\d]*','g'),' ');
 t=t.replace(/[\d,]{3,}\s*(km|킬로|키로)?/gi,' ');
 t=t.replace(/주행\s*거리|계기판|현재\s*주행/g,' ');
 t=t.replace(/썼어|썼다|썼는데|샀어|샀다|결제했어|결제|계산했어|계산|지출|장봤어|장을?\s*봤어|먹었어|마셨어|냈어|들었어|했어요|했어|했다|함|했음|교체했어|교체|넣었어|기록해줘|적어줘|기록|추가해줘|해줘/g,' ');
 t=t.replace(/에서|에게|한테|으로|로|을|를|이|가|은|는|의|랑|와|과|도|만/g,' ');
 return t.replace(/\s{2,}/g,' ').trim();
}
function voiceMerchant(s){
 let m=String(s).match(/([가-힣A-Za-z0-9][가-힣A-Za-z0-9]{0,14}(?:\s[가-힣A-Za-z0-9]{1,10})?)\s*에서/);
 let c=m?m[1]:'';
 if(c){
  c=c.replace(/그저께|그제|모레|어제|내일|오늘/g,' ').replace(/\s{2,}/g,' ').trim();
  /* '12만원 카센터' 처럼 금액이 앞에 붙어 잡히면 떼어낸다 (단 '공원' 같은 낱말은 지키기) */
  const cut=c.replace(new RegExp('^['+KCH+'\\d][ '+KCH+'\\d]*\\s*원\\s*'),'').trim();
  if(cut)c=cut;
  if(c)return c;
 }
 const t=voiceStrip(s);
 const w=t.split(/\s+/).filter(x=>x.length>=2);
 return w.length?w[0]:'';
}

/* 차계부에서는 '주유' 같은 기록 종류 낱말을 상호로 잡지 않는다 */
function carPlace(s){
 let t=String(s||'');
 /* '주행거리' 를 먼저 지운다. CARKINDS 의 '주행' 이 앞서 지워지면 '거리' 가 남는다 */
 t=t.replace(/주행\s*거리|계기판|현재\s*주행|엔진오일|타이어|하이패스/g,' ');
 CARKINDS.forEach(k=>{if(k[1])t=t.replace(new RegExp(reEsc(k[1]),'g'),' ')});
 t=t.replace(/현재|지금|킬로미터|킬로|키로|km/gi,' ');
 const n=voiceMerchant(t);
 if(!n)return '';
 if(CARKINDS.some(k=>k[1]===n))return '';
 return n;
}
/* ================= 의도 해석 ================= */
function voiceParse(text,ctx){
 const raw=String(text==null?'':text).trim();
 const R={intent:'unknown',confidence:0,rawText:raw,fields:{},missing:[],ambiguous:[]};
 if(!raw)return R;
 const hint=(ctx&&typeof ctx==='object'&&ctx.hint)?ctx.hint:'';
 const s=raw;
 const amount=krWon(s);
 const date=krDate(s);
 const time=krTime(s);
 const who=krWho(s);
 const cardM=s.match(/([가-힣A-Za-z]{2,8}카드)/);
 const odoM=s.match(/(?:주행\s*거리|계기판|현재\s*주행)\s*([\d,]{3,})/)
         || s.match(/([\d,]{4,})\s*(?:km|킬로|키로|킬로미터)/i);
 const odo=odoM?(+String(odoM[1]).replace(/,/g,'')||0):0;
 const carKind=CARKINDS.find(k=>k[1]&&k[0]!=='etc'&&s.indexOf(k[1])>=0);
 const hasCarWord=!!carKind||/엔진오일|타이어|세차|주유|충전|정비|통행료|하이패스/.test(s);
 let nCars=0; try{nCars=cars().length}catch(_){}

 /* 1) 다이어리 명령 */
 if(/일기|다이어리/.test(s)&&/적어|써|쓰|기록|남겨|추가/.test(s)){
  R.intent='diary'; R.confidence=.9;
  const body=s.replace(/(에|을|를)?\s*(일기|다이어리)에?\s*(적어줘|적어|써줘|써|쓰기|기록해줘|기록|남겨줘|남겨|추가해줘|추가)\s*$/,'').trim()
             .replace(/^(오늘|어제|그제|내일)\s*/,'');
  R.fields={date:date||today(),text:body||s};
  if(!body)R.ambiguous.push('본문');
  return R;
 }
 /* 2) 차계부 */
 if(hasCarWord&&nCars>0&&(amount||odo)){
  const kind=carKind?carKind[0]:(/엔진오일|타이어|정비/.test(s)?'maint':'etc');
  R.intent='car'; 
  R.confidence=.5+(amount?.2:0)+(odo?.15:0)+(carKind?.15:0);
  const car=carByName(s)||(()=>{try{return curCar()}catch(_){return null}})();
  R.fields={date:date||today(),dateAssumed:!date,kind,amount:amount||0,odo:odo||0,
    carId:car?car.id:'',item:/엔진오일/.test(s)?'엔진오일':/타이어/.test(s)?'타이어':'',
    name:carPlace(s),by:who.by||S.profile,scope:who.sc||''};
  if(!amount&&kind!=='drive')R.missing.push('금액');
  if(nCars>1&&!carByName(s))R.ambiguous.push('차량');
  return R;
 }
 /* 3) 일정 */
 const schedWord=/약속|예약|미팅|회의|만나|일정|모임|생일|기념일|가기로|하기로/.test(s);
 if(!amount&&(time||schedWord)){
  R.intent='schedule';
  R.confidence=.4+(time?.3:0)+(date?.15:0)+(schedWord?.15:0);
  let title=voiceStrip(s).replace(/약속|예약|일정|기록|추가/g,' ').replace(/\s{2,}/g,' ').trim();
  if(!title)title=voiceStrip(s);
  R.fields={date:date||today(),dateAssumed:!date,time:time||'',title:title,
    who:who.sc==='our'?'our':(who.by||'our'),cat:/병원|치과|진료/.test(s)?'병원':/여행/.test(s)?'여행':'커플'};
  if(!title)R.missing.push('제목');
  if(!date)R.ambiguous.push('날짜');
  return R;
 }
 /* 4) 수입 · 이체 · 지출 */
 if(amount){
  const isIn=/입금|받았|월급|급여|들어왔|환급|용돈\s*받/.test(s);
  const isTr=/이체|송금|옮겼|보냈/.test(s)&&!/에서/.test(s);
  R.intent=isIn?'income':isTr?'transfer':'expense';
  const merchant=voiceMerchant(s);
  R.confidence=.4+(amount?.25:0)+(merchant?.2:0)+(date?.1:0)+(cardM?.05:0);
  R.fields={date:date||today(),dateAssumed:!date,amount,merchant,
    category:'',subcategory:'',payment:cardM?cardM[1]:'',
    by:who.by||'',scope:who.sc||'',memo:''};
  if(R.intent==='expense'){
   try{const g=guessCat({text:merchant,place:null,
     pay:cardM?finCardMatch(cardM[1]):null});
    if(g){R.fields.category=g.cat;R.fields.subcategory=g.sub||'';R.fields.why=g.why||''}
   }catch(_){}
  }
  if(!merchant)R.missing.push('내용');
  if(!who.by)R.ambiguous.push('결제자');
  return R;
 }
 /* 5) '다시 말하기' 로 들어온 경우 : 같은 Intent 틀을 유지해 부족한 칸만 보여준다 */
 if(hint&&['expense','income','transfer','schedule','car'].indexOf(hint)>=0){
  R.intent=hint; R.confidence=.25;
  if(hint==='schedule'){
   const ttl=voiceStrip(s);
   R.fields={date:date||today(),dateAssumed:!date,time:time||'',title:ttl,
     who:who.sc==='our'?'our':(who.by||'our'),cat:'커플'};
   if(!ttl)R.missing.push('제목');
  }else if(hint==='car'){
   let car=null; try{car=carByName(s)||curCar()}catch(_){}
   R.fields={date:date||today(),dateAssumed:!date,kind:carKind?carKind[0]:'etc',
     amount:amount||0,odo:odo||0,carId:car?car.id:'',item:'',name:carPlace(s),
     by:who.by||S.profile,scope:who.sc||''};
   if(!amount)R.missing.push('금액');
   if(nCars>1&&!carByName(s))R.ambiguous.push('차량');
  }else{
   const mc=voiceMerchant(s);
   R.fields={date:date||today(),dateAssumed:!date,amount:amount||0,merchant:mc,
     category:'',subcategory:'',payment:cardM?cardM[1]:'',by:who.by||'',scope:who.sc||'',memo:''};
   if(!amount)R.missing.push('금액');
   if(!mc)R.missing.push('내용');
  }
  return R;
 }
 /* 6) 문장만 있음 */
 if(raw.length>=6){R.intent='text';R.confidence=.3;R.fields={text:raw};return R}
 return R;
}

/* ================= 폼 채우기 (저장하지 않음) ================= */
function voiceApply(R){
 if(!R||R.intent==='unknown'){
  toast('무슨 뜻인지 정확히 모르겠어요. 다시 말해 주세요');
  return false;
 }
 const F=R.fields||{};
 try{
  if(R.intent==='diary'){
   const k=F.date||today();
   openDay(k);
   setTimeout(()=>{
    const el=document.getElementById('dtx');
    if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
      voiceDictate(el,F.text||R.rawText,'diary');toast('일기에 적었어요')}
    else toast('일기 칸을 찾지 못했어요');
   },260);
   return true;
  }
  if(R.intent==='schedule'){
   evSheet(null,F.date||today());
   EV.title=F.title||''; EV.date=F.date||today(); EV.time=F.time||'';
   if(F.who)EV.who=F.who;
   if(F.cat&&EVCATS.some(c=>c[0]===F.cat))EV.cat=F.cat;
   drawEV();
   voiceMsg(R,`${F.date||today()} ${F.time||''} ${F.title||''}`.trim());
   return true;
  }
  if(R.intent==='car'){
   if(F.carId&&S.carSel!==F.carId){S.carSel=F.carId;try{save()}catch(_){}}
   crSheet(F.kind||'etc');
   CR.date=F.date||today();
   if(F.amount)CR.a=F.amount;
   if(F.odo)CR.odo=F.odo;
   if(F.carId)CR.carId=F.carId;
   if(F.item)CR.item=F.item;
   if(F.name)CR.name=F.name;
   if(F.scope==='our')CR.who='our'; else if(F.by)CR.who=F.by;
   drawCR();
   voiceMsg(R,`${ckName(F.kind)} ${F.amount?comma(F.amount)+'원':''}${F.odo?' · '+comma(F.odo)+'km':''}`);
   return true;
  }
  if(R.intent==='expense'||R.intent==='income'||R.intent==='transfer'){
   selDate=F.date||today();
   expSheet();
   EX.t=R.intent==='income'?'in':R.intent==='transfer'?'tr':'out';
   EX.date=F.date||today();
   EX.a=F.amount||0;
   EX.name=F.merchant||'';
   if(F.by)EX.by=F.by;
   if(F.scope)EX.sc=F.scope;
   if(F.payment){try{const m=finCardMatch(F.payment);
     EX.pay={type:'card',issuer:m.issuer||'',cardId:m.cardId||''}}catch(_){}}
   /* 분류는 기존 autoCat 을 그대로 태운다 (_touched 를 false 로 두어야 동작) */
   EX._touched=false; EX._auto=false;
   if(EX.t==='out'){try{autoCat()}catch(_){}}
   drawEX();
   voiceMsg(R,`${comma(F.amount||0)}원${F.merchant?' · '+F.merchant:''}`);
   return true;
  }
  if(R.intent==='text'){
   const el=document.getElementById('dtx');
   if(el){voiceDictate(el,F.text,'text');return true}
   openDay(today());
   setTimeout(()=>{const e2=document.getElementById('dtx');
    if(e2){e2.focus();try{e2.setSelectionRange(e2.value.length,e2.value.length)}catch(_){}
      voiceDictate(e2,F.text,'text');toast('일기에 적었어요')}
    else toast('무슨 뜻인지 정확히 모르겠어요. 다시 말해 주세요')},260);
   return true;
  }
 }catch(_){toast('내용을 옮기지 못했어요');return false}
 toast('무슨 뜻인지 정확히 모르겠어요. 다시 말해 주세요');
 return false;
}
/* 부분적으로만 알아들었을 때 안내 */
function voiceMsg(R,sum){
 const F=R.fields||{};
 if(R.missing&&R.missing.indexOf('내용')>=0&&F.amount){
  toast(`${comma(F.amount)}원 지출은 이해했어요. 어디에서 쓴 건지 말해주세요`);
  setTimeout(()=>{const el=document.getElementById('eN');if(el)el.focus()},220);
  return;
 }
 if(R.missing&&R.missing.indexOf('금액')>=0){toast('금액을 알아듣지 못했어요. 금액을 넣어주세요');return}
 if(R.missing&&R.missing.indexOf('제목')>=0){toast('일정 내용을 알아듣지 못했어요');return}
 if(R.ambiguous&&R.ambiguous.indexOf('차량')>=0){toast('어떤 차량인지 골라주세요');return}
 toast(`이렇게 채웠어요 — ${sum||''}`.trim()+' · 확인 후 저장해주세요');
}

/* ===== 음성 STEP4 : Review UX ===== */
/* ==================================================================
   음성 STEP 4 — Voice Review UX
   ------------------------------------------------------------------
   · 구조화 Intent(지출·수입·이체·일정·차계부)는 해석 직후 곧바로 폼을
     확정하지 않고 review 상태에서 확인 화면을 먼저 보여준다.
   · text · 일반 일기 받아쓰기는 예전처럼 바로 커서 위치에 넣는다.
   · 저장은 여전히 사용자가 기존 저장 버튼을 눌러야 한다.
   ================================================================== */
const VREVIEW=['expense','income','transfer','schedule','car'];
let VREV=null;          /* 확인 대기 중인 해석 결과 */

/* ---------- 표시용 도우미 ---------- */
function vrvDate(k){
 if(!k)return '';
 try{const d=parse(k);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`}catch(_){return k}
}
function vrvWho(w){
 if(w==='our')return '같이';
 if(w==='me')return S.names.me||'나';
 if(w==='you')return S.names.you||'상대';
 return '';
}
/* 주행거리 형식 검사 : 0 이면 미입력, true 면 정상 */
function vrvOdoBad(carId,odo){
 if(!odo)return '';
 if(odo<0||odo>2000000||!Number.isFinite(odo))return '주행거리 값이 이상해요';
 try{const cur=carOdo(carId);if(cur&&odo<cur)return `기존 기록(${comma(cur)}km)보다 작아요`}catch(_){}
 return '';
}
/* ---------- 확인 항목 만들기 ---------- */
/* [라벨, 값, 상태]  상태: '' 정상 | 'need' 입력 필요 | 'warn' 경고 */
function vrvRows(R){
 const F=R.fields||{}, out=[];
 const need=t=>[t,'입력 필요','need'];
 if(R.intent==='expense'||R.intent==='income'||R.intent==='transfer'){
  out.push(['날짜',vrvDate(F.date),F.dateAssumed?'warn':'']);
  out.push(F.amount?['금액',comma(F.amount)+'원','']:need('금액'));
  out.push(F.merchant?['내용',F.merchant,'']:need('내용'));
  if(R.intent==='expense')out.push(F.category?['분류',F.category+(F.subcategory?' › '+F.subcategory:''),'']
    :['분류','저장할 때 자동으로 골라드려요','']);
  if(F.payment)out.push(['결제수단',F.payment,'']);
  out.push(F.by?['결제자',vrvWho(F.by),'']:['결제자',vrvWho(S.profile)+' (기본값)','warn']);
  if(F.scope==='our')out.push(['구분','공동지출','']);
 }else if(R.intent==='schedule'){
  out.push(['날짜',vrvDate(F.date),F.dateAssumed?'warn':'']);
  out.push(F.time?['시간',F.time,'']:['시간','하루 종일','']);
  out.push(F.title?['제목',F.title,'']:need('제목'));
  out.push(['담당',vrvWho(F.who)||'같이','']);
 }else if(R.intent==='car'){
  let nm='', many=false;
  try{many=cars().length>1; nm=F.carId?carName(carOf(F.carId)):''}catch(_){}
  out.push(F.carId?['차량',nm,(many&&R.ambiguous.indexOf('차량')>=0)?'warn':'']:need('차량'));
  out.push(['기록',ckName(F.kind)||'기타 차량비','']);
  out.push(['날짜',vrvDate(F.date),F.dateAssumed?'warn':'']);
  if(F.kind==='drive')out.push(['금액','없음 (주행 기록)','']);
  else out.push(F.amount?['금액',comma(F.amount)+'원','']:need('금액'));
  const ob=vrvOdoBad(F.carId,F.odo);
  out.push(F.odo?['주행거리',comma(F.odo)+'km',ob?'warn':'']:['주행거리','입력 안 함','']);
  if(F.item)out.push(['품목',F.item,'']);
  if(F.name)out.push(['내용',F.name,'']);
 }
 return out;
}
/* ---------- 경고 문구 ---------- */
function vrvWarns(R){
 const F=R.fields||{}, W=[];
 if((R.intent==='expense'||R.intent==='income'||R.intent==='transfer')&&!F.amount)W.push('금액을 알아듣지 못했어요');
 if(R.intent==='car'&&F.kind!=='drive'&&!F.amount)W.push('금액을 알아듣지 못했어요');
 if(R.intent==='schedule'&&!F.title)W.push('일정 제목을 알아듣지 못했어요');
 if(R.intent==='car'){
  let many=false; try{many=cars().length>1}catch(_){}
  if(many&&(!F.carId||R.ambiguous.indexOf('차량')>=0))W.push('차가 여러 대예요. 어떤 차인지 확인해주세요');
  const ob=vrvOdoBad(F.carId,F.odo); if(ob)W.push(ob);
 }
 if(F.dateAssumed)W.push('날짜를 못 알아들어서 오늘로 잡았어요');
 return W;
}
const VRVTITLE={expense:'지출',income:'수입',transfer:'이체',schedule:'일정',car:'차계부'};
/* ---------- 확인 화면 ---------- */
function voiceReview(R){
 if(!R||VREVIEW.indexOf(R.intent)<0)return false;
 VREV=R;
 VoiceManager.setState('review');
 const rows=vrvRows(R), warns=vrvWarns(R);
 sheet(`<h3>말씀하신 내용을 이렇게 이해했어요</h3>
 <div class="vrv">
   <div class="vrvh"><b>${VRVTITLE[R.intent]||'기록'}</b>
     <i>${esc(R.rawText||'')}</i></div>
   <div class="vrvb">
     ${rows.map(r=>`<div class="vrvr ${r[2]}"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
   </div>
   ${warns.length?`<div class="vrvw">${warns.map(w=>`<div>· ${esc(w)}</div>`).join('')}</div>`:''}
 </div>
 <div class="btns">
   <button class="btn g" onclick="voiceReAsk()">다시 말하기</button>
   <button class="btn p" onclick="voiceReviewGo()">입력하기</button>
 </div>`);
 return true;
}
/* 입력하기 : STEP 3 의 필드 채우기 경로를 그대로 탄다 (저장 안 함) */
function voiceReviewGo(){
 const R=VREV; VREV=null;
 try{close_()}catch(_){}
 if(!R)return;
 setTimeout(()=>{try{voiceApply(R)}catch(_){toast('내용을 옮기지 못했어요')}},120);
}
/* 다시 말하기 : 같은 Intent 를 힌트로 다시 듣는다 */
function voiceReAsk(){
 const hint=VREV?VREV.intent:''; VREV=null;
 try{close_()}catch(_){}
 setTimeout(()=>{VoiceManager.start({mode:'cmd',hint:hint,view:view})},160);
}
/* 확인 화면을 닫으면 idle 로 되돌린다 (close_ 래퍼가 cancel 을 부른다) */
(function(){
 try{
  const _c=close_;
  close_=function(){VREV=null;return _c.apply(this,arguments)};
 }catch(_){}
})();


/* ===== 음성 QA : 개발용 디버그 ===== */
/* ==================================================================
   음성 QA 보강 — 실기기 디버그 (개발용, 메모리에만 남는다)
   ------------------------------------------------------------------
   · 저장하지 않는다 : S / localStorage / IndexedDB / Supabase 어디에도
     넣지 않으며 새로고침하면 사라진다.
   · 기본값 꺼짐. 일반 UI 에는 아무것도 보이지 않는다.
   · 켜는 방법 : 콘솔에서 RokiBokiVoice.debugOn()
                 또는 설정 › 음성 입력 제목을 일곱 번 두드리기
   ================================================================== */
const VDBG={on:false,max:30,list:[],_last:null,_meta:null,_seq:0};

function vdbgNorm(t){return String(t==null?'':t).replace(/\s+/g,' ').trim()}
function vdbgPush(e){
 if(!VDBG.on)return;
 VDBG._seq++;
 e.n=VDBG._seq;
 const d=new Date(); e.at=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
 VDBG.list.unshift(e);
 if(VDBG.list.length>VDBG.max)VDBG.list.length=VDBG.max;
 try{if(window.console&&console.log)console.log('[voice]',JSON.parse(JSON.stringify(e)))}catch(_){}
 try{if(document.getElementById('vdbgbox'))vdbgDraw()}catch(_){}
}
/* ---------- 후킹 : 원래 동작은 그대로 두고 옆에서 지켜보기만 한다 ---------- */
(function(){
 try{
  const _s=VoiceManager.start.bind(VoiceManager);
  VoiceManager.start=function(ctx){
   VDBG._meta={provider:VoiceManager.provider,mode:(ctx&&ctx.mode)||'dictate',
     hint:(ctx&&ctx.hint)||'',lang:(voiceLocal()||{}).lang||''};
   return _s(ctx);
  };
 }catch(_){}
 try{
  const _p=voiceParse;
  voiceParse=function(t,c){const R=_p.apply(this,arguments);
   if(VDBG.on)VDBG._last={text:t,ctx:c,R:R}; return R};
 }catch(_){}
 try{
  const _d=voiceDone;
  voiceDone=function(t){
   VDBG._last=null;
   const r=_d.apply(this,arguments);
   if(VDBG.on){
    const m=VDBG._meta||{}, L=VDBG._last, R=L&&L.R;
    const raw=String(t==null?'':t), norm=vdbgNorm(raw);
    let strip=''; try{strip=voiceStrip(norm)}catch(_){}
    vdbgPush({kind:'result',provider:m.provider||VoiceManager.provider,lang:m.lang||'',
      mode:m.mode||'dictate',hint:m.hint||'',
      raw:raw,normalized:norm,stripped:strip,
      intent:R?R.intent:(m.mode==='cmd'?'(파싱 없음)':'(받아쓰기)'),
      confidence:R?R.confidence:null,
      fields:R?R.fields:null,missing:R?R.missing:[],ambiguous:R?R.ambiguous:[],
      reviewed:(typeof VREVIEW!=='undefined'&&R)?VREVIEW.indexOf(R.intent)>=0:false});
   }
   VDBG._last=null;
   return r;
  };
 }catch(_){}
 try{
  const _e=voiceErr;
  voiceErr=function(code){
   if(VDBG.on){const m=VDBG._meta||{};
    vdbgPush({kind:'error',provider:m.provider||VoiceManager.provider,lang:m.lang||'',
      mode:m.mode||'dictate',hint:m.hint||'',errorCode:String(code||''),
      raw:'',normalized:'',intent:null,confidence:null,fields:null,missing:[],ambiguous:[]})}
   return _e.apply(this,arguments);
  };
 }catch(_){}
})();
/* ---------- 개발용 인터페이스 ---------- */
try{
 window.RokiBokiVoice.debug=function(){return JSON.parse(JSON.stringify(VDBG.list))};
 window.RokiBokiVoice.debugOn=function(){VDBG.on=true;toast('음성 디버그 기록 시작 (이 기기 메모리에만)');return true};
 window.RokiBokiVoice.debugOff=function(){VDBG.on=false;VDBG.list=[];VDBG._last=null;return true};
 window.RokiBokiVoice.debugClear=function(){VDBG.list=[];return true};
 window.RokiBokiVoice.debugOpen=function(){VDBG.on=true;vdbgSheet();return true};
 window.RokiBokiVoice.debugText=function(){return vdbgText()};
 /* 실기기에서 파서만 따로 돌려보고 싶을 때 (저장·화면 변화 없음) */
 window.RokiBokiVoice.dryRun=function(text,hint){
  let R=null; try{R=voiceParse(String(text||''),{hint:hint||''})}catch(e){return {error:String(e)}}
  return JSON.parse(JSON.stringify(R));
 };
}catch(_){}

/* ---------- 숨은 확인 화면 (설정 › 음성 입력 제목 일곱 번) ---------- */
function vdbgText(){
 return VDBG.list.map(e=>[
  `#${e.n} ${e.at} [${e.kind}] provider=${e.provider} mode=${e.mode}${e.hint?' hint='+e.hint:''}`,
  e.errorCode?`  error: ${e.errorCode}`:'',
  e.raw?`  recognition: ${e.raw}`:'',
  e.normalized&&e.normalized!==e.raw?`  normalized: ${e.normalized}`:'',
  e.stripped?`  stripped: ${e.stripped}`:'',
  e.intent?`  intent: ${e.intent}${e.confidence!=null?' ('+Math.round(e.confidence*100)/100+')':''}`:'',
  e.fields?`  fields: ${JSON.stringify(e.fields)}`:'',
  (e.missing&&e.missing.length)?`  missing: ${e.missing.join(', ')}`:'',
  (e.ambiguous&&e.ambiguous.length)?`  ambiguous: ${e.ambiguous.join(', ')}`:''
 ].filter(Boolean).join('\n')).join('\n\n')||'아직 기록이 없어요. 디버그를 켠 뒤 말해보세요.';
}
function vdbgDraw(){
 const el=document.getElementById('vdbgbox'); if(!el)return;
 el.textContent=vdbgText();
}
function vdbgSheet(){
 sheet(`<h3>음성 디버그 (개발용)</h3>
 <div style="font-size:11px;color:var(--sub);font-weight:700;margin:-4px 2px 9px;line-height:1.7">
   ${VDBG.on?'기록 중':'꺼져 있음'} · 최근 ${VDBG.max}건 · 이 기기 메모리에만 있고 새로고침하면 사라집니다.
   서버·백업에는 저장되지 않습니다.</div>
 <pre id="vdbgbox" style="background:var(--surface2);border-radius:14px;padding:12px;font-size:10.5px;
   line-height:1.65;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0"></pre>
 <div class="btns" style="margin-top:12px">
   <button class="btn g" onclick="vdbgCopy()">복사</button>
   <button class="btn g" onclick="RokiBokiVoice.debugClear();vdbgDraw()">지우기</button>
   <button class="btn ${VDBG.on?'g':'p'}" onclick="VDBG.on=!VDBG.on;vdbgSheet()">${VDBG.on?'기록 끄기':'기록 켜기'}</button>
 </div>
 <div class="btns" style="margin-top:9px"><button class="btn g" onclick="close_()">닫기</button></div>`);
 vdbgDraw();
}
function vdbgCopy(){
 const t=vdbgText();
 try{navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>toast('복사하지 못했어요'))}
 catch(_){toast('복사하지 못했어요')}
}
let VDBGTAP=0, VDBGT0=0;
function vdbgTap(){
 const n=Date.now();
 if(n-VDBGT0>1600)VDBGTAP=0;
 VDBGT0=n; VDBGTAP++;
 if(VDBGTAP>=7){VDBGTAP=0;VDBG.on=true;vdbgSheet()}
}

/* 시작 */
window.onerror=function(m){

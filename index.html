/* ================= 이미지 최적화 · 중복 제거 ================= */
const QOPT={low:{max:1280,q:0.78,n:'저용량'},std:{max:1600,q:0.82,n:'기본'},high:{max:2048,q:0.86,n:'고화질'}};
let WEBP_OK=null;
function webpOK(){
 if(WEBP_OK!==null)return WEBP_OK;
 try{const c=document.createElement('canvas');c.width=c.height=2;
  WEBP_OK=c.toDataURL('image/webp').indexOf('data:image/webp')===0}catch(_){WEBP_OK=false}
 return WEBP_OK;
}
function imgQ(){return QOPT[S.imgq]||QOPT.std}
/* 이미지 인코딩 — WebP 우선, 미지원이면 JPEG */
function encodeImg(file,opt){
 const o=Object.assign({},imgQ(),opt||{});
 return new Promise(res=>{
  const img=new Image(), fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{
    const sw=img.width, sh=img.height;
    const s=Math.min(1,o.max/Math.max(sw,sh));
    const c=document.createElement('canvas');
    c.width=Math.max(1,sw*s|0); c.height=Math.max(1,sh*s|0);
    const x=c.getContext('2d');
    x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    x.drawImage(img,0,0,c.width,c.height);
    const type=(o.type)||(webpOK()?'image/webp':'image/jpeg');
    c.toBlob(b=>{
      if(!b&&type!=='image/jpeg'){c.toBlob(b2=>res({blob:b2,w:c.width,h:c.height,sw,sh}),'image/jpeg',o.q);return}
      res({blob:b,w:c.width,h:c.height,sw,sh});
    },type,o.q);
   };
   img.onerror=()=>res(null);
   img.src=fr.result};
  fr.onerror=()=>res(null);
  fr.readAsDataURL(file);
 });
}
/* 기존 호출부 호환 */
function resize(file){return encodeImg(file).then(r=>r&&r.blob)}

/* 내용 해시 (같은 사진 두 번 저장 방지) */
async function blobHash(blob){
 try{
  const buf=await blob.arrayBuffer();
  const v=new Uint8Array(buf);
  let h1=0x811c9dc5, h2=0x01000193;
  const step=Math.max(1,Math.floor(v.length/40000));
  for(let i=0;i<v.length;i+=step){
   h1=((h1^v[i])*16777619)>>>0;
   h2=((h2+v[i]*31)^(h2<<5))>>>0;
  }
  return blob.size.toString(36)+'-'+h1.toString(36)+h2.toString(36);
 }catch(_){return null}
}
/* 파일 참조 수 (다른 곳에서 쓰고 있으면 지우지 않는다) */

function orphanFiles(){

 Object.values(S.days||{}).forEach(d=>(d.photos||[]).forEach(x=>used.add(x)));

function loadGIS(cb){
 if(window.google&&google.accounts&&google.accounts.oauth2)return cb(true);
 if(GISLOADED){setTimeout(()=>cb(!!(window.google&&google.accounts)),1200);return}
 GISLOADED=true;

 s.src='https://accounts.google.com/gsi/client';

function gpAuth(){

  loadGIS(ok=>{
   if(!ok)return res(null);
   try{
    const tc=google.accounts.oauth2.initTokenClient({
     client_id:S.gphotos.clientId, scope:GP_SCOPE,
     callback:t=>res((t&&t.access_token)||null),
     error_callback:()=>res(null)
    });
    tc.requestAccessToken();
   }catch(_){res(null)}
  });
 });
}

function monthAgg(y,m,who){

 monthExp(y,m,(e,k)=>{

  if(isTr(e)){R.tr+=e.a;return}
  if(isIn(e)){R.inc+=e.a;R.byDayIn[d]=(R.byDayIn[d]||0)+e.a;return}
  R.out+=e.a;R.cnt++;
  R.byCat[e.cat]=(R.byCat[e.cat]||0)+e.a;
  const sk=e.cat+'||'+(e.sub||'기타'); R.bySub[sk]=(R.bySub[sk]||0)+e.a;
  R.byWho[expWho(e)]=(R.byWho[expWho(e)]||0)+e.a;
  const pl=payLabel(e); R.byPay[pl]=(R.byPay[pl]||0)+e.a;
  R.byDay[d]=(R.byDay[d]||0)+e.a;
 });
 return R;
}
/* 예산·통계용 지출 합계 (필터 반영, 이체 제외) */
function monthOut(y,m,cat,who){
 const W=who===undefined?ledWho:who;
 let s=0;
 monthExp(y,m,e=>{
  if(!isOut(e))return;
  if(W!=='all'&&expWho(e)!==W)return;
  if(cat&&e.cat!==cat)return;
  s+=e.a;
 });
 return s;
}
/* [중복정의 제거] */
function daySum(k){const d=S.days[k];return d?d.exp.reduce((a,b)=>a+(isOut(b)?b.a:0),0):0}
function dayAgg(k){
 const d=S.days[k]; const R={out:0,inc:0,tr:0,who:{our:0,me:0,you:0},list:[]};
 if(!d)return R;
 (d.exp||[]).forEach(e=>{
  if(!whoOK(e))return;
  R.list.push(e);
  if(isTr(e)){R.tr+=e.a;return}
  if(isIn(e)){R.inc+=e.a;return}
  R.out+=e.a; R.who[expWho(e)]=(R.who[expWho(e)]||0)+e.a;
 });
 return R;
}

const RUNITS=[['day','일'],['week','주'],['month','개월']];
function repLabel(o){
 if(!o||!o.rep||o.rep==='none')return '';
 if(o.rep==='custom'){const n=+o.every||1,u=(RUNITS.find(x=>x[0]===(o.unit||'day'))||RUNITS[0])[1];
  return `${n}${u}마다`}
 return (REPS.find(r=>r[0]===o.rep)||['','반복'])[1];
}
function repBox(name,o){
 return `<div class="fl">반복</div>
 <div class="opts">${REPS.map(r=>`<div class="opt sm ${o.rep===r[0]?'on':''}" onclick="${name}.rep='${r[0]}';draw${name}()">${r[1]}</div>`).join('')}</div>
 ${o.rep==='custom'?`<div class="fl">주기</div>
 <div style="display:flex;gap:7px;align-items:center">
   <input class="in" type="number" min="1" max="365" style="flex:0 0 88px;text-align:center"
     value="${+o.every||1}" onchange="${name}.every=Math.max(1,+this.value||1);draw${name}()">
   <div class="opts" style="flex:1">${RUNITS.map(u=>`<div class="opt sm ${(o.unit||'day')===u[0]?'on':''}"
     onclick="${name}.unit='${u[0]}';draw${name}()">${u[1]}마다</div>`).join('')}</div>
 </div>
 <div style="font-size:11px;color:var(--sub);font-weight:700;margin:6px 2px 0">${esc(repLabel(o))} 반복됩니다</div>`:''}`;
}
const monDiff=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
function evOccurs(ev,k){
 if(!ev||!ev.date||k<ev.date)return false;
 const r=ev.rep||'none';
 if(r==='none')return k===ev.date;
 if(ev.until&&k>ev.until)return false;
 const a=parse(ev.date),b=parse(k);
 const dd=Math.round((b-a)/86400000);
 if(r==='day')return true;
 if(r==='week')return a.getDay()===b.getDay();
 if(r==='biweek')return a.getDay()===b.getDay()&&dd%14===0;
 if(r==='month')return a.getDate()===b.getDate();
 if(r==='year')return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
 if(r==='custom'){
  const n=Math.max(1,+ev.every||1), u=ev.unit||'day';
  if(u==='day')return dd%n===0;
  if(u==='week')return a.getDay()===b.getDay()&&(dd/7)%n===0;
  if(u==='month')return a.getDate()===b.getDate()&&monDiff(a,b)%n===0;
 }
 return false;
}
function nextRep(k,r,o){
 const d=parse(k);
 if(r==='day')d.setDate(d.getDate()+1);
 else if(r==='week')d.setDate(d.getDate()+7);
 else if(r==='biweek')d.setDate(d.getDate()+14);
 else if(r==='month')d.setMonth(d.getMonth()+1);
 else if(r==='year')d.setFullYear(d.getFullYear()+1);
 else if(r==='custom'){
  const n=Math.max(1,+((o||{}).every)||1), u=((o||{}).unit)||'day';
  if(u==='day')d.setDate(d.getDate()+n);
  else if(u==='week')d.setDate(d.getDate()+7*n);
  else d.setMonth(d.getMonth()+n);
 }
 return key(d);
}

function catNorm(s){return String(s||'').toLowerCase().replace(/[\s\-_·.,()[\]]/g,'')}
function catKeys(c){
 const K=[];
 const n=catNorm(c.text);
 if(n.length>=2)K.push('nm:'+n);
 if(c.place&&c.place.name)K.push('pl:'+catNorm(c.place.name));
 if(c.pay&&c.pay.issuer)K.push('py:'+catNorm(c.pay.issuer));
 return K;
}
function learnCat(c,cat,sub){
 if(!cat)return;
 if(!S.catStats)S.catStats={};
 const v=cat+'||'+(sub||'');
 catKeys(c).forEach(k=>{const m=S.catStats[k]=S.catStats[k]||{};m[v]=(m[v]||0)+1});
}
/* 반환 : {cat,sub,why,score} | null */
function guessCat(c){
 if(!c)return null;
 const sc={},why={};
 const add=(cat,sub,w,rz)=>{
  if(!cat)return;
  const v=cat+'||'+(sub||'');
  sc[v]=(sc[v]||0)+w; if(!why[v])why[v]=rz;
 };
 /* 학습 우선 */
 const stats=S.catStats||{};
 catKeys(c).forEach(k=>{
  const m=stats[k]; if(!m)return;
  const tot=Object.values(m).reduce((a,b)=>a+b,0)||1;
  const rz=k.slice(0,2)==='nm'?'같은 내용을 이렇게 넣으셨어요'
        :k.slice(0,2)==='pl'?'이 장소에서 늘 쓰던 분류':'이 카드로 자주 쓰던 분류';
  Object.keys(m).forEach(v=>{const p=v.split('||');
   add(p[0],p[1],4*(m[v]/tot)+Math.min(1.6,m[v]*0.25),rz)});
 });
 /* 규칙 */
 const txt=[c.text,c.place&&c.place.name].filter(Boolean).join(' ');
 if(txt)CATRULES.forEach(r=>{if(r[0].test(txt))add(r[1][0],r[1][1],2,'이름으로 알아봤어요')});
 /* 존재하는 카테고리만 */
 const names=S.cats.map(x=>x.n);

 if(!EX._auto)EX._auto0=EX.cat;

 if(LF.min||LF.max)n++; if(LF.from||LF.to)n++; if(LF.place)n++;

function lfMatch(e,k){
 if(LF.t!=='all'&&(LF.t==='out'?!isOut(e):LF.t==='in'?!isIn(e):!isTr(e)))return false;
 if(LF.who!=='all'&&expWho(e)!==LF.who)return false;
 if(LF.cats.length&&!LF.cats.includes(e.cat))return false;
 if(LF.pays.length&&!LF.pays.includes((e.pay||{}).type))return false;
 if(LF.tags.length&&!LF.tags.every(t=>(e.tags||[]).includes(t)))return false;
 if(LF.min&&e.a<LF.min)return false;
 if(LF.max&&e.a>LF.max)return false;
 if(LF.from&&k<LF.from)return false;
 if(LF.to&&k>LF.to)return false;
 if(LF.place&&!((e.place&&e.place.name)||'').includes(LF.place))return false;
 if(LF.q){const q=LF.q.toLowerCase();
  const hay=[e.name,e.cat,e.sub,e.memo,e.place&&e.place.name,payLabel(e),
   (e.tags||[]).map(t=>tagName(t)).join(' ')].filter(Boolean).join(' ').toLowerCase();
  if(hay.indexOf(q)<0)return false}
 return true;
}

/* ---------- pdf.js 로더 ---------- */
const PDFJS_CDN=[
 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs',
 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.min.mjs',
 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs'];
const PDFJS_WK=[
 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs',
 'https://unpkg.com/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs',
 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs'];
let PDFERR='';
async function loadPDFJS(){
 if(window.pdfjsLib)return true;
 if(location.protocol==='file:'){PDFERR='파일로 직접 열면 PDF를 읽을 수 없습니다. 인터넷 주소로 접속해주세요';return false}
 for(let i=0;i<PDFJS_CDN.length;i++){
  try{
   const m=await import(PDFJS_CDN[i]);
   window.pdfjsLib=m;
   try{m.GlobalWorkerOptions.workerSrc=PDFJS_WK[i]}catch(_){}
   return true;
  }catch(_){}
 }
 PDFERR='PDF 모듈을 내려받지 못했습니다 (인터넷 확인)';
 return false;
}
/* PDF → 전체 텍스트 */
async function pdfText(file){
 const buf=await file.arrayBuffer();
 const doc=await pdfjsLib.getDocument({data:buf}).promise;
 let out=[];
 for(let p=1;p<=doc.numPages;p++){
  const pg=await doc.getPage(p);
  const tc=await pg.getTextContent();
  let line='', last=null, lines=[];
  tc.items.forEach(it=>{
   const y=it.transform[5];
   if(last!==null&&Math.abs(y-last)>3){lines.push(line);line=''}
   line+=it.str; last=y;
  });
  lines.push(line);
  out.push(lines.join('\n'));
 }
 return out.join('\n');
}

function parseCardPdf(txt){
 const T=String(txt||'');
 const flat=T.replace(/[ \t]+/g,' ');
 const c=defCard(); const got={}; const miss=[];
 const mark=(k,v)=>{if(v!==null&&v!==undefined&&v!=='' &&!(Array.isArray(v)&&!v.length)){got[k]=true;return v}miss.push(k);return null};

 /* 카드명 : 첫 번째 '…카드' 로 끝나는 짧은 줄 */
 const lines=flat.split('\n').map(s=>s.trim()).filter(Boolean);
 let nm=null;
 for(const l of lines.slice(0,12)){
  if(/카드$/.test(l)&&l.length<=20&&!/찾기|랭킹|비교/.test(l)){nm=l;break}
 }
 c.name=mark('name',nm)||'';
 const iss=(flat.match(/(삼성|신한|현대|KB국민|국민|롯데|하나|우리|NH농협|농협|BC|씨티|카카오뱅크|토스뱅크)카드/)||[])[0];
 c.issuer=mark('issuer',iss)||'';

 /* 연회비 */
 const fees=[...flat.matchAll(/(국내전용|해외겸용|국내겸용)\s*:?\s*([\d,]+)\s*원/g)]
   .map(m=>m[1]+' '+m[2]+'원');
 c.fee=mark('fee',fees.join(' · '))||'';

 /* 실적 기준 */
 c.perfBase = /전월\s*(이용금액|실적)/.test(flat) ? 'prev' : 'curr';
 got.perfBase=true;
 c.cycleFrom = /매월\s*1일부터\s*말일까지/.test(flat) ? 1 : 1;
 got.cycleFrom=/매월\s*1일부터\s*말일까지/.test(flat);
 if(!got.cycleFrom)miss.push('cycleFrom');

 /* 실적 구간 : 표의 한 줄에 금액이 나열되고 다음 줄에 혜택 한도가 온다 */
 const tiers=[];
 (()=>{
  const L=flat.split('\n').map(x=>x.trim()); const cand=[];
  for(let i=0;i<L.length;i++){
   const am=[...L[i].matchAll(/(\d+)\s*만원\s*이상/g)].map(m=>+m[1]*10000);
   if(!am.length||L[i].length>90)continue;
   if(/미만|이하/.test(L[i]))continue;
   const seen={}; const uniq=am.filter(a=>seen[a]?false:(seen[a]=1));
   if(!uniq.length)continue;
   let caps=[];
   for(let j=i+1;j<Math.min(i+3,L.length);j++){
    if(!L[j])continue;
    const cp=[...L[j].matchAll(/([\d,]+)\s*원/g)].map(m=>+m[1].replace(/,/g,'')).filter(v=>v>=1000);
    if(cp.length){caps=cp;break}
   }
   cand.push({uniq,caps});
  }
  /* 구간이 가장 많이 나열된 줄을 표로 본다 (본문에 '전월실적 30만원 이상' 처럼
     한 개만 언급된 줄이 앞에 나오는 경우가 많음) */
  cand.sort((a,b)=>b.uniq.length-a.uniq.length);
  const best=cand[0];
  if(best)best.uniq.forEach((a,k)=>tiers.push({amount:a,cap:best.caps[k]||0,
    label:best.caps[k]?comma(best.caps[k])+'원 혜택':''}));
 })();
 c.tiers=mark('tiers',tiers)||[];

 /* 발급월 유예 */
 const g=flat.match(/발급월\s*\+\s*(\d+)\s*개월/);
 c.graceMonths=g?(+g[1]+1):0;
 if(g)got.graceMonths=true; else miss.push('graceMonths');

 /* 무이자 할부 / 할인건 처리 */
 c.exFreeInst=/무이자\s*할부[^\n]{0,12}(이용금액|제외)/.test(flat);
 got.exFreeInst=true;
 c.bnfMode = /(할인이?\s*적용된|혜택이?\s*제공된)[\s\S]{0,40}(전체\s*)?이용금액/.test(flat) ? 'whole' : 'discount';
 got.bnfMode=true;

 /* 제외 대상 문장 수집 */
 let blk='';
 const b1=flat.match(/(?:전월\s*이용금액\s*제외\s*대상|실적\s*제외\s*대상)([\s\S]{0,900})/);
 if(b1)blk=b1[1].split(/\n\s*-\s*(?:삼성카드 가맹점|결제 취소|BC카드|아래)/)[0];
 const b2=flat.match(/\(단기카드대출[\s\S]{0,200}?해당되지\s*않음\)/);
 const src=(blk||'')+' '+((b2&&b2[0])||'');
 const subs=[],words=[];
 CARD_EXMAP.forEach(([re,kind,val])=>{
  if(re.test(src)){ if(kind==='sub'){if(!subs.includes(val))subs.push(val)}
                    else {if(!words.includes(val))words.push(val)} }
 });
 c.exSubs=mark('exSubs',subs)||[];
 c.exWords=mark('exWords',words)||[];
 c.src=(blk||'').split('·').map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>4).join('\n');

 return {card:c, got, miss, raw:T};
}

/* ================= 카드 실적 계산 엔진 =================
   · 실적 인정 여부는 저장하지 않고 볼 때마다 계산합니다.
     (카드 조건을 바꾸면 과거 달도 즉시 새 기준으로 다시 계산됩니다)
   · 실적은 카드 단위로 합산합니다. 결제자(보키·로키)나 공동/개인 구분은 보지 않습니다.
   ====================================================== */

/* 이 지출이 어느 카드로 결제됐나 (기존 데이터는 카드사 이름으로 연결) */
function expCard(e){
 const p=(e&&e.pay)||{};
 if(p.type!=='card')return null;
 if(p.cardId){const c=cardOf(p.cardId); if(c)return c}
 return cardByIssuer(p.issuer);
}
/* 실적에서 빠진 이유. 빈 문자열이면 인정됨 */
function perfWhy(e,c){
 if(!c)return '';
 if((c.exCats||[]).includes(e.cat))return esc(e.cat)+' 제외';
 if((c.exSubs||[]).includes(e.sub))return esc(e.sub)+' 제외';
 const txt=[e.name,e.memo,e.sub,e.cat].filter(Boolean).join(' ');
 const w=(c.exWords||[]).find(x=>txt.includes(x));
 if(w)return '"'+esc(w)+'" 포함';
 if(c.exFreeInst&&e.instFree)return '무이자 할부';
 if(e.bnf&&c.bnfMode==='whole')return '혜택 받은 건';
 return '';
}
/* 이 지출이 이 카드 실적에 인정되는 금액. 0이면 미인정 */
function perfAmt(e,c){
 if(!c||!isOut(e))return 0;
 let a=(+e.a||0)-(+e.cancel||0);
 if(a<=0)return 0;
 if(perfWhy(e,c))return 0;
 if(e.bnf&&c.bnfMode==='discount'){
  a-=(+e.bnfAmt||0);
  if(a<=0)return 0;
 }
 if(e.inst>1&&c.instMode==='monthly')a=Math.round(a/e.inst);
 return a;
}
/* 카드의 y년 m월 실적 */
function perfSum(c,y,m){
 const R={sum:0,used:0,by:{our:0,me:0,you:0},ok:[],no:[],noSum:0};
 monthExp(y,m,(e,k)=>{
  if(expCard(e)!==c)return;
  if(!isOut(e))return;
  R.used+=(+e.a||0)-(+e.cancel||0);
  const a=perfAmt(e,c);
  if(a>0){R.sum+=a;R.by[expWho(e)]=(R.by[expWho(e)]||0)+a;R.ok.push({e,k,a})}
  else {R.no.push({e,k,why:perfWhy(e,c)||'실적 미산입'});R.noSum+=(+e.a||0)-(+e.cancel||0)}
 });
 return R;
}
/* 이번 달 혜택은 어느 달 실적으로 정해지나 */
function perfMonthFor(c,y,m){
 return c.perfBase==='prev' ? [(m===0?y-1:y),(m===0?11:m-1)] : [y,m];
}
/* 구간 판정 */
function tierOf(c,sum){
 const T=(c.tiers||[]).slice().sort((a,b)=>a.amount-b.amount);
 let cur=null,next=null;
 T.forEach(t=>{ if(sum>=t.amount)cur=t; else if(!next)next=t });
 return {cur,next,left:next?next.amount-sum:0,
   pct: next? (sum/next.amount*100) : (T.length? 100 : 0)};
}
/* 발급 유예 기간인가 */
function inGrace(c,y,m){
 if(!c.openedAt||!c.graceMonths)return false;
 const p=String(c.openedAt).split('-').map(Number);
 if(p.length<2)return false;
 const diff=(y-p[0])*12+(m-(p[1]-1));
 return diff>=0&&diff<c.graceMonths;
}
const perfLabel=t=>t?(t.label||comma(t.amount)+'원 구간'):'';

/* ---------- 가계부 안 실적 카드 ---------- */
function perfBar(pct,warn){
 return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,pct))}%;
   background:${warn?'linear-gradient(90deg,#F6A96B,#F472B6)':'linear-gradient(90deg,#4FAE7C,#7FC7E8)'}"></i></div>`;
}
function perfCards(){
 const L=(S.cards||[]).filter(c=>c.on!==false&&(c.tiers||[]).length);
 if(!L.length)return '';
 const y=cur.getFullYear(),m=cur.getMonth();
 return `<div class="sec">💳 카드 실적 <span class="more" onclick="go('cardlist')">카드 관리 ›</span></div>
 ${L.map(c=>{
   const [by,bm]=perfMonthFor(c,y,m);
   const B=perfSum(c,by,bm);              /* 이번 달 혜택을 정하는 실적 */
   const N=perfSum(c,y,m);                /* 지금 쌓는 중인 실적 */
   const tb=tierOf(c,B.sum), tn=tierOf(c,N.sum);
   const grace=inGrace(c,y,m);
   const sameMonth=(by===y&&bm===m);
   return `<div class="card" onclick="perfSheet('${c.id}')" style="cursor:pointer">

 '브레이크패드':[40000,0],'타이어':[50000,0],'타이어 위치교환':[10000,0],'에어컨필터':[10000,12],
 '에어필터':[20000,12],'배터리':[60000,36],'냉각수':[80000,24],'와이퍼':[0,12],

/* ---------- 차량 ---------- */
function cars(){if(!Array.isArray(S.cars))S.cars=[];return S.cars}
function carLogs(){if(!Array.isArray(S.carlogs))S.carlogs=[];return S.carlogs}
function defCar(){return {id:'cr'+uid(),name:'',plate:'',maker:'',fuel:'gas',odo0:0,
 year:'',bought:'',released:'',ins:'',insp:'',who:'our',memo:'',at:Date.now()}}
function carOf(id){return cars().find(c=>c.id===id)||null}
function curCar(){const L=cars();if(!L.length)return null;return L.find(c=>c.id===S.carSel)||L[0]}
function carName(c){if(typeof c==='string')c=carOf(c);return c?(c.name||[c.maker,c.model].filter(Boolean).join(' ')||'내 차'):'내 차'}
function carDesc(c){return c?[c.maker,c.plate].filter(Boolean).join(' · '):''}
function isEVCar(c){return !!(c&&c.fuel==='ev')}
function setCar(id){S.carSel=id;save();close_();render()}
function addM(k,n){const d=parse(k);d.setMonth(d.getMonth()+n);return key(d)}
function slug(s){return String(s||'').replace(/[^0-9A-Za-z가-힣]/g,'')||'x'}

/* ---------- 기록 읽기 (지출 + 주행로그 통합) ---------- */
function carRecs(carId){
 const out=[]; if(!carId)return out;
 allExp((e,k)=>{const c=e.car; if(!c||c.id!==carId)return;
  out.push({rid:'e:'+e.id,src:'exp',id:e.id,day:k,date:e.date||k,a:isOut(e)?(+e.a||0):0,
   kind:c.kind||'etc',odo:+c.odo||0,m:c,name:e.name||'',memo:e.memo||'',e});
 });
 carLogs().forEach(l=>{if(l.carId!==carId)return;
  out.push({rid:'l:'+l.id,src:'log',id:l.id,day:l.date,date:l.date,a:0,
   kind:l.kind||'drive',odo:+l.odo||0,m:l,name:l.name||'',memo:l.memo||'',l});
 });
 out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.odo-a.odo));
 return out;
}
function carRec(rid){return carRecs(curCar()?curCar().id:'').find(r=>r.rid===rid)||null}
/* 지금까지의 최고 주행거리 */
function carOdo(carId){
 const c=carOf(carId); let mx=c?(+c.odo0||0):0;
 carRecs(carId).forEach(r=>{if(r.odo>mx)mx=r.odo});
 return mx;
}
/* 날짜순 주행거리 기록 */
function odoReads(carId){
 const A=carRecs(carId).filter(r=>r.odo>0).map(r=>({d:r.date,o:r.odo}));
 const c=carOf(carId);
 if(c&&+c.odo0>0&&c.bought)A.push({d:c.bought,o:+c.odo0});
 A.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.o-b.o);
 return A;
}
/* 기간 주행거리 (자료가 부족하면 null) */
function carKm(carId,from,to){
 const A=odoReads(carId); if(A.length<2)return null;
 const inR=A.filter(x=>x.d>=from&&x.d<=to); if(!inR.length)return 0;
 const bef=A.filter(x=>x.d<from);
 const base=bef.length?bef[bef.length-1].o:inR[0].o;
 return Math.max(0,inR[inR.length-1].o-base);
}
/* 연비 · 전비 : '가득 주유'로 끊은 구간만 계산 */
function fuelStats(carId,from,to){
 const c=carOf(carId), ev=isEVCar(c);
 const kind=ev?'ev':'fuel', qk=ev?'kwh':'L';
 const all=carRecs(carId).filter(r=>r.kind===kind);
 const R=all.slice().sort((a,b)=>a.odo-b.odo||(a.date<b.date?-1:1));
 let km=0,qty=0,segs=0,lastFull=-1,acc=0;
 R.forEach((r,i)=>{
  if(lastFull<0){ if(r.m.full&&r.odo>0){lastFull=i;acc=0} return }
  acc+=(+r.m[qk]||0);
  if(r.m.full&&r.odo>R[lastFull].odo){km+=r.odo-R[lastFull].odo;qty+=acc;segs++;lastFull=i;acc=0}
 });
 const inR=from?all.filter(r=>r.date>=from&&r.date<=to):all;
 const mQty=inR.reduce((a,r)=>a+(+r.m[qk]||0),0);
 const mAmt=inR.reduce((a,r)=>a+r.a,0);
 return {ev,kind,unit:ev?'kWh':'L',eff:(km&&qty)?km/qty:0,segs,km,qty,
  mQty,mAmt,mUnit:mQty?mAmt/mQty:0,cnt:inR.length,total:all.length};
}
/* 차량비 (기간) */
function carCost(carId,y,m){
 const R={sum:0,byKind:{},cnt:0};
 carRecs(carId).forEach(r=>{
  if(r.src!=='exp'||!r.a)return;
  const d=parse(r.date);
  if(d.getFullYear()!==y)return;
  if(m!==undefined&&m!==null&&d.getMonth()!==m)return;
  R.sum+=r.a;R.cnt++;R.byKind[r.kind]=(R.byKind[r.kind]||0)+r.a;
 });
 return R;
}
/* ---------- 정비 예정 ---------- */
function maintPlan(carId){
 const odo=carOdo(carId), t=today(), by={};
 carRecs(carId).filter(r=>r.kind==='maint').forEach(r=>{
  const it=r.m.item||'기타';
  if(!by[it]||r.date>by[it].date)by[it]=r;
 });
 const out=Object.keys(by).map(it=>{
  const r=by[it], cyc=MAINTCYC[it]||[0,0];
  let nOdo=+r.m.nextOdo||0, nDate=r.m.nextDate||'';
  if(!nOdo&&cyc[0]&&r.odo)nOdo=r.odo+cyc[0];
  if(!nDate&&cyc[1])nDate=addM(r.date,cyc[1]);
  const leftKm=nOdo?nOdo-odo:null, leftDay=nDate?dayDiff(t,nDate):null;
  return {item:it,lastOdo:r.odo,lastDate:r.date,nextOdo:nOdo,nextDate:nDate,
   leftKm,leftDay,rid:r.rid,
   sk:Math.min(leftKm==null?9e9:leftKm,leftDay==null?9e9:leftDay*40)};
 });
 out.sort((a,b)=>a.sk-b.sk);
 return out;
}
/* 상태 : over(지남) / soon(임박) / ok */
function planState(p){
 const a=p.leftKm, b=p.leftDay;
 if((a!=null&&a<=0)||(b!=null&&b<0))return 'over';
 if((a!=null&&a<=1000)||(b!=null&&b<=14))return 'soon';
 return 'ok';
}
function stColor(s){return s==='over'?'var(--warn)':s==='soon'?'#F0A828':'var(--ok)'}
/* 보험 · 검사까지 합친 '다가오는 차량 일정' */
function carDues(carId){
 const t=today(), car=carOf(carId), out=[];
 if(!car)return out;
 maintPlan(carId).forEach(p=>out.push({ic:'🔧',t:p.item,
  sub:`최근 ${p.lastOdo?comma(p.lastOdo)+'km · ':''}${p.lastDate}`,
  r:p.leftKm!=null?(p.leftKm>0?comma(p.leftKm)+'km 남음':comma(-p.leftKm)+'km 지남')
    :(p.leftDay!=null?(p.leftDay>=0?'D-'+p.leftDay:'D+'+(-p.leftDay)):''),
  st:planState(p),go:`crSheet('maint','${p.rid}')`}));
 [['ins','🛡️','자동차보험 만기'],['insp','🚘','자동차검사']].forEach(x=>{

function crNew(kind,carId){
 return {kind,carId,date:today(),odo:ODOKIND.indexOf(kind)>=0?(carOdo(carId)||0):0,a:0,
  L:0,kwh:0,unit:0,full:true,fast:false,item:'엔진오일',shop:'',
  nextOdo:0,nextDate:'',name:'',memo:'',diary:false,
  pay:{type:'card',issuer:S.pay.card[0]||''},who:(carOf(carId)||{}).who||'our'};
}
function crSheet(kind,rid){
 const car=curCar(); if(!car){carSheet();return}
 CRrid=rid||null;
 if(rid){
  const r=carRecs(car.id).find(x=>x.rid===rid);
  if(!r){CRrid=null;CR=crNew(kind,car.id)}
  else{
   const m=r.m||{};
   CR={kind:r.kind,carId:car.id,date:r.date,odo:+m.odo||0,a:r.a,
    L:+m.L||0,kwh:+m.kwh||0,unit:0,full:m.full!==false,fast:!!m.fast,
    item:m.item||'엔진오일',shop:m.shop||'',nextOdo:+m.nextOdo||0,nextDate:m.nextDate||'',
    name:r.name||'',memo:r.memo||'',diary:!!m.diary,
    pay:r.e?JSON.parse(JSON.stringify(r.e.pay||{type:'card',issuer:''})):{type:'card',issuer:''},
    who:r.e?expWho(r.e):(m.who||'our'),_day:r.day,_src:r.src,_id:r.id};
   if(CR.L&&CR.a)CR.unit=Math.round(CR.a/CR.L);
   if(CR.kwh&&CR.a)CR.unit=Math.round(CR.a/CR.kwh);
  }
 }else CR=crNew(kind,car.id);
 drawCR();
}
function crNum(f,el,dec){
 const v=dec?(parseFloat(el.value.replace(/[^0-9.]/g,''))||0):(+el.value.replace(/[^0-9]/g,'')||0);
 CR[f]=v;
}
/* 금액 ↔ 수량 ↔ 단가 자동 계산 */
function crCalc(from){
 const q=CR.kind==='ev'?'kwh':'L';
 const a=+CR.a||0, qty=+CR[q]||0, u=+CR.unit||0;
 if(from==='a'||from===q){ if(a&&qty)CR.unit=Math.round(a/qty*100)/100; }
 else if(from==='unit'){ if(u&&qty)CR.a=Math.round(u*qty); else if(u&&a)CR[q]=Math.round(a/u*100)/100; }
 if(from==='a'&&!qty&&u)CR[q]=Math.round(a/u*100)/100;
 if(from===q&&!a&&u)CR.a=Math.round(u*qty);
 drawCR();
}
function crWho(w){CR.who=w;drawCR()}
function crPay(t){CR.pay.type=t;CR.pay.issuer=t==='card'?(S.pay.card[0]||''):t==='point'?(S.pay.point[0]||''):'';drawCR()}
function crPayBox(){
 const iss=CR.pay.type==='card'?S.pay.card:CR.pay.type==='point'?S.pay.point:[];
 return `<div class="fl">결제수단</div>
 <div class="seg">${PAYT.map(p=>`<div class="sg ${CR.pay.type===p[0]?'on':''}" onclick="crPay('${p[0]}')">${p[2]} ${p[1]}</div>`).join('')}</div>
 ${iss.length?`<div class="opts" style="margin-top:8px">${iss.map(i=>
   `<div class="opt sm ${CR.pay.issuer===i?'on':''}" onclick="CR.pay.issuer='${esc(i)}';drawCR()">${esc(i)}</div>`).join('')}</div>`:''}`;
}
function crWhoBox(){

function drawCR(){
 const car=carOf(CR.carId)||curCar();

  ${ev?`<div class="fl">충전 방식</div>
   <div class="seg"><div class="sg ${CR.fast?'on':''}" onclick="CR.fast=true;drawCR()">⚡ 급속</div>
    <div class="sg ${!CR.fast?'on':''}" onclick="CR.fast=false;drawCR()">🔌 완속</div></div>`:''}
  <div class="fl">${ev?'완충 여부':'가득 주유'}</div>
  <div class="seg"><div class="sg ${CR.full?'on':''}" onclick="CR.full=true;drawCR()">${ev?'완충했어요':'가득 채웠어요'}</div>
   <div class="sg ${!CR.full?'on':''}" onclick="CR.full=false;drawCR()">일부만</div></div>
  <div style="font-size:10.5px;color:var(--sub);font-weight:600;margin:6px 2px 0">
    ${ev?'전비':'연비'}는 ‘${ev?'완충':'가득'}’으로 표시한 기록 사이의 구간만으로 계산해요</div>

 }else if(k==='maint'){
  const cyc=MAINTCYC[CR.item]||[0,0];
  body=`
  <div class="fl">정비 종류</div>
  <div class="opts">${MAINTS.map(x=>`<div class="opt sm ${CR.item===x?'on':''}" onclick="CR.item='${x}';drawCR()">${x}</div>`).join('')}</div>
  <div class="fl">날짜</div><input class="in" type="date" value="${CR.date}" onchange="CR.date=this.value||CR.date;drawCR()">
  ${crOdoBox()}
  ${crAmtBox('비용 (없으면 비워두세요)')}
  <div class="fl">정비소</div>
  <input class="in" placeholder="예: ○○모터스" value="${esc(CR.shop)}" oninput="CR.shop=this.value">
  <div class="fl">다음 교체 주행거리 (km)</div>
  <input class="in" inputmode="numeric" value="${CR.nextOdo?comma(CR.nextOdo):''}"
    placeholder="${cyc[0]&&CR.odo?comma(CR.odo+cyc[0])+' (일반 주기)':'비우면 주기로 자동 계산'}"
    oninput="crNum('nextOdo',this)" onblur="this.value=CR.nextOdo?comma(CR.nextOdo):''">
  <div class="fl">다음 교체 예정일</div>
  <input class="in" type="date" value="${CR.nextDate||''}" onchange="CR.nextDate=this.value">
  <div style="font-size:10.5px;color:var(--sub);font-weight:600;margin:6px 2px 0">
    ${cyc[0]||cyc[1]?`일반적인 ${CR.item} 주기는 ${[cyc[0]?comma(cyc[0])+'km':'',cyc[1]?cyc[1]+'개월':''].filter(Boolean).join(' · ')} 입니다. 비워두면 이 값으로 안내해요.`
     :'비워두면 다음 교체 안내를 하지 않아요'}</div>
  ${crPayBox()}${crWhoBox()}`;
 }else if(k==='drive'){
  body=`
  <div class="fl">날짜</div><input class="in" type="date" value="${CR.date}" onchange="CR.date=this.value||CR.date;drawCR()">
  ${crOdoBox()}
  <div class="fl">메모</div>
  <input class="in" placeholder="예: 강릉 여행 다녀옴" value="${esc(CR.memo)}" oninput="CR.memo=this.value">

 sheet(`<h3>${ckIcon(k)} ${ckName(k)} ${CRrid?'수정':'기록'}</h3>

   <div class="opt sm ${CR.diary?'on':''}" onclick="CR.diary=!CR.diary;drawCR()">${CR.diary?'✓ ':''}📔 다이어리에 표시</div>
 </div>`:''}
 ${(k!=='drive')?`<div style="font-size:10.5px;color:var(--sub);font-weight:600;margin:9px 2px 0;line-height:1.7">

 <div class="btns">
  ${CRrid?`<button class="btn g" onclick="crDelAsk()">삭제</button>`:`<button class="btn g" onclick="close_()">취소</button>`}
  <button class="btn p" onclick="crSave()">저장</button></div>`);
}
/* 표시 이름 */
function crLabel(){
 if(CR.name.trim())return CR.name.trim();
 if(CR.kind==='maint')return CR.item+(CR.shop?' · '+CR.shop:'');
 return ckName(CR.kind);
}
function crMeta(){
 const m={id:CR.carId,kind:CR.kind,odo:+CR.odo||0,diary:!!CR.diary};
 if(CR.kind==='fuel'){m.L=+CR.L||0;m.full=!!CR.full}
 if(CR.kind==='ev'){m.kwh=+CR.kwh||0;m.full=!!CR.full;m.fast=!!CR.fast}
 if(CR.kind==='maint'){m.item=CR.item;m.shop=CR.shop;m.nextOdo=+CR.nextOdo||0;m.nextDate=CR.nextDate||''}
 return m;
}
function crRemoveOld(){
 if(!CRrid)return;
 if(CR._src==='exp'){const o=S.days[CR._day]; if(o)o.exp=(o.exp||[]).filter(x=>x.id!==CR._id)}
 else S.carlogs=carLogs().filter(l=>l.id!==CR._id);
}
function crSave(){
 if(CR.kind!=='drive'&&!CR.a&&CR.kind!=='maint')return toast('금액을 입력해주세요');
 if(CR.kind==='drive'&&!CR.odo)return toast('주행거리를 입력해주세요');
 if(CR.kind==='maint'&&!CR.a&&!CR.odo)return toast('비용이나 주행거리를 입력해주세요');
 const a=+CR.a||0;
 crRemoveOld();
 if(a>0){
  const e={id:(CRrid&&CR._src==='exp')?CR._id:uid(),date:CR.date,t:'out',a,
   cat:CARCAT,sub:ckSub(CR.kind)||'기타',icon:'🚗',
   by:CR.who==='our'?S.profile:CR.who, sc:CR.who==='our'?'our':'per',
   pay:JSON.parse(JSON.stringify(CR.pay||{type:'cash',issuer:''})),
   place:null,name:crLabel(),memo:CR.memo||'',tags:[],goalId:'',tripId:'',priv:false,
   bnf:false,bnfAmt:0,inst:0,instFree:false,cancel:0,at:Date.now(),car:crMeta()};
  try{if(e.pay&&e.pay.type==='card'&&!e.pay.cardId){const c0=cardByIssuer(e.pay.issuer);if(c0)e.pay.cardId=c0.id}}catch(_){}
  D(CR.date).exp.push(e);
 }else{
  const l={id:(CRrid&&CR._src==='log')?CR._id:uid(),carId:CR.carId,kind:CR.kind,
   date:CR.date,odo:+CR.odo||0,name:crLabel(),memo:CR.memo||'',
   item:CR.item,nextOdo:+CR.nextOdo||0,nextDate:CR.nextDate||'',
   full:!!CR.full,L:+CR.L||0,kwh:+CR.kwh||0,who:CR.who,diary:!!CR.diary,at:Date.now()};
  carLogs().push(l);
 }
 if(CR.kind==='maint')maintEvSync(CR.carId);
 save();close_();render();toast(CRrid?'수정했어요':'기록했어요');
}
function crDelAsk(){
 if(CR._src!=='exp'){crDel('all');return}
 sheet(`<h3>이 기록을 지울까요</h3>
 <div style="font-size:12.5px;color:var(--sub);font-weight:600;line-height:1.8;margin:2px 2px 10px">
   이 기록은 가계부 지출(<b>${comma(CR.a)}원</b>)과 연결되어 있어요.</div>
 <div class="opts" style="flex-direction:column;align-items:stretch">
  <div class="opt sm" style="text-align:left;padding:13px" onclick="crDel('all')">🗑 차량 기록과 가계부 지출 모두 삭제</div>
  <div class="opt sm" style="text-align:left;padding:13px;margin-top:7px" onclick="crDel('unlink')">🔗 차량 기록 연결만 해제 (가계부에는 남김)</div>
 </div>
 <div class="btns"><button class="btn g" onclick="drawCR()">취소</button></div>`);
}
function crDel(mode){
 if(mode==='unlink'&&CR._src==='exp'){
  const o=S.days[CR._day]; const e=o&&(o.exp||[]).find(x=>x.id===CR._id);
  if(e)delete e.car;
  toast('가계부 지출은 그대로 두고 차량 연결만 해제했어요');
 }else{
  crRemoveOld();
  toast('삭제했어요');
 }
 if(CR.kind==='maint')maintEvSync(CR.carId);
 save();close_();render();
}

   ic:ckIcon(e.car.kind),a:isOut(e)?e.a:0,odo:+e.car.odo||0,id:e.car.id})});

/* ---------- 알림센터용 ---------- */
function carNoti(){
 const out=[];
 cars().forEach(c=>{
  carDues(c.id).filter(d=>d.st!=='ok').slice(0,4).forEach(d=>{
   out.push({ic:d.ic,tt:d.st==='over'?'차량 점검 필요':'차량 일정 임박',
    s:`${carName(c)} ${d.t} · ${d.r}`,go:"go('car')",k:'car'+c.id+d.t+d.r});
  });
 });
 return out;
}

function buildRecords(){
 const out={};
 Object.keys(S.days).forEach(day=>{
  const d=S.days[day]; if(!d)return;
  if(d.wx)out['dm_'+day]={id:'dm_'+day,kind:'daymeta',day,slot:null,data:{wx:d.wx}};
  ['me','you'].forEach(sl=>{const x=(d.diary||{})[sl];
   if(x&&(x.text||x.mood||x.title||(x.tags||[]).length))out[`di_${day}_${sl}`]={id:`di_${day}_${sl}`,kind:'diary',day,slot:sl,
     data:{text:x.text||'',mood:x.mood||null,title:x.title||'',tags:x.tags||[]}}});
  (d.exp||[]).forEach(e=>{if(e&&e.id)out[e.id]={id:e.id,kind:'expense',day,slot:e.by||'me',data:e}});
  ['me','you'].forEach(sl=>{const c=(d.chk||{})[sl]||{};
   const on=Object.keys(c).filter(k=>c[k]);
   if(on.length)out[`ck_${day}_${sl}`]={id:`ck_${day}_${sl}`,kind:'check',day,slot:sl,data:{items:on}}});
  if((d.places||[]).length)out['pp_'+day]={id:'pp_'+day,kind:'places',day,slot:null,data:{list:d.places}};
  (d.photos||[]).forEach(pid=>{out[pid]={id:pid,kind:'photo',day,slot:(fileMeta(pid)||{}).slot||null,data:fileMetaRec(pid)}});
 });
 return out;
}
const sigOf=r=>JSON.stringify(r.data);
/* DB에 넣을 파일 메타데이터 (파일 자체는 넣지 않음) */
function fileMetaRec(id){
 const m=fileMeta(id)||{};
 return {p:m.provider||'supabase',path:m.path||filePath(id),t:m.type||'image/jpeg',
   sz:m.size||0,own:m.slot||'',ca:m.created_at||'',
   src:m.source||'device',gid:m.google_media_id||'',fn:m.original_filename||'',
   ow:m.original_width||0,oh:m.original_height||0,ta:m.taken_at||'',w:m.w||0,h:m.h||0,hs:m.hash||''};
}
function applyFileMeta(id,data){
 if(!data||typeof data!=='object')return;
 if(!S.files)S.files={};
 const m=S.files[id]||{id};
 if(data.p)m.provider=data.p;
 if(data.path)m.path=data.path;
 if(data.t)m.type=data.t;
 if(data.sz)m.size=data.sz;
 if(data.own)m.slot=data.own;
 if(data.ca)m.created_at=data.ca;
 if(data.src)m.source=data.src;
 if(data.gid)m.google_media_id=data.gid;
 if(data.fn)m.original_filename=data.fn;
 if(data.ow)m.original_width=data.ow;
 if(data.oh)m.original_height=data.oh;
 if(data.ta)m.taken_at=data.ta;
 if(data.w)m.w=data.w;
 if(data.h)m.h=data.h;
 if(data.hs){m.hash=data.hs;if(!S.fileHash)S.fileHash={};S.fileHash[data.hs]=id}
 m.up=true; m.deleted_at=null;
 S.files[id]=m;
}

function applyRecord(r){
 if(r.deleted)return removeRecord(r);
 const d=D(r.day);
 if(r.kind==='daymeta')d.wx=(r.data||{}).wx||null;
 else if(r.kind==='diary'){d.diary[r.slot]=d.diary[r.slot]||{};d.diary[r.slot].text=r.data.text||'';d.diary[r.slot].mood=r.data.mood||null;
   d.diary[r.slot].title=r.data.title||'';d.diary[r.slot].tags=r.data.tags||[]}
 else if(r.kind==='expense'){const e=Object.assign({},r.data);e.id=r.id;
  const i=d.exp.findIndex(x=>x.id===r.id); if(i>=0)d.exp[i]=e; else d.exp.push(e)}
 else if(r.kind==='check'){const set={};(r.data.items||[]).forEach(k=>set[k]=true);d.chk[r.slot]=set}
 else if(r.kind==='places')d.places=r.data.list||[];
 else if(r.kind==='photo'){if(!d.photos.includes(r.id))d.photos.push(r.id);
   applyFileMeta(r.id,r.data);PHOTO_WANT.add(r.id)}
}
function removeRecord(r){
 const d=S.days[r.day]; if(!d)return;
 if(r.kind==='expense')d.exp=(d.exp||[]).filter(x=>x.id!==r.id);
 else if(r.kind==='photo')d.photos=(d.photos||[]).filter(x=>x!==r.id);
 else if(r.kind==='diary'){if(d.diary[r.slot])d.diary[r.slot]={}}
 else if(r.kind==='daymeta')d.wx=null;
 else if(r.kind==='check')d.chk[r.slot]={};
 else if(r.kind==='places')d.places=[];
}

/* ---- 동기화 ---- */
async function syncNow(manual){
 if(SYNCING)return;
 if(!SB){const ok=await initSB();if(!ok){if(manual)toast(SYNCERR||'연결 준비 실패');return}}
 if(!SESS){if(manual)toast('먼저 로그인해주세요');return}
 if(!S.sync||!S.sync.spaceId){if(manual)toast('공간을 먼저 만들거나 합류해주세요');return}
 SYNCING=true;SYNCERR='';paintSync();
 const sid=S.sync.spaceId;
 try{
  /* 1) 받기 */
  const since=S.sync.cursor||'1970-01-01T00:00:00Z';
  const {data:rows,error:e1}=await SB.from('records').select('*').eq('space_id',sid).gt('updated_at',since).order('updated_at',{ascending:true}).limit(2000);
  if(e1)throw e1;
  (rows||[]).forEach(r=>{applyRecord(r);S.sync.sig[r.id]={s:r.deleted?'DEL':sigOf(r),kind:r.kind,day:r.day,slot:r.slot}});
  if(rows&&rows.length)S.sync.cursor=rows[rows.length-1].updated_at;

  const {data:sp,error:e2}=await SB.from('spaces').select('settings,updated_at,code').eq('id',sid).maybeSingle();
  if(e2)throw e2;
  if(sp){
   S.sync.code=sp.code;
   if(sp.updated_at&&sp.updated_at!==S.sync.setCursor&&sp.settings&&Object.keys(sp.settings).length){
    applySettings(sp.settings);S.sync.setCursor=sp.updated_at;S.sync.setSig=JSON.stringify(pickSettings());
   }
  }

  /* 2) 보내기 */
  const cur=buildRecords(), ups=[], now=new Date().toISOString();
  Object.values(cur).forEach(r=>{
   const old=S.sync.sig[r.id];
   if(!old||old.s!==sigOf(r))ups.push({id:r.id,space_id:sid,kind:r.kind,day:r.day,slot:r.slot,data:r.data,deleted:false,deleted_at:null,updated_at:now});
  });
  Object.keys(S.sync.sig).forEach(id=>{
   const m=S.sync.sig[id];
   if(!cur[id]&&m&&m.s!=='DEL')ups.push({id,space_id:sid,kind:m.kind,day:m.day,slot:m.slot,data:{},deleted:true,deleted_at:now,updated_at:now});
  });
  /* 사진 먼저 올리기 (Storage 계층 경유) */
  for(const r of ups.filter(x=>x.kind==='photo'&&!x.deleted)){
   try{await Storage.push(r.id)}catch(_){}
   r.data=fileMetaRec(r.id);
  }
  for(let i=0;i<ups.length;i+=100){
   const chunk=ups.slice(i,i+100);
   const {error:e3}=await SB.from('records').upsert(chunk,{onConflict:'id'});
   if(e3)throw e3;
   chunk.forEach(r=>{S.sync.sig[r.id]={s:r.deleted?'DEL':JSON.stringify(r.data),kind:r.kind,day:r.day,slot:r.slot}});
  }
  /* 설정 보내기 */
  const setSig=JSON.stringify(pickSettings());
  if(setSig!==S.sync.setSig){
   const {data:sp2,error:e4}=await SB.from('spaces').update({settings:pickSettings(),updated_at:now}).eq('id',sid).select('updated_at').maybeSingle();
   if(e4)throw e4;
   S.sync.setSig=setSig; if(sp2)S.sync.setCursor=sp2.updated_at;
  }
  /* 3) 없는 사진 내려받기 */
  let n=0;
  for(const id of Array.from(PHOTO_WANT)){
   if(n>=20)break;
   const has=await DB.get('p:'+id);
   if(!has){await pullPhoto(id);n++}
   PHOTO_WANT.delete(id);
  }
  S.sync.last=new Date().toISOString();
  save();
  SYNCING=false;paintSync();
  if(rows&&rows.length)safeRender();
  if(manual)toast('동기화 완료');
 }catch(e){
  SYNCING=false;SYNCERR=String((e&&(e.message||e.error_description))||e);paintSync();
  if(manual)toast('동기화 실패: '+SYNCERR.slice(0,40));
 }
}

async function doSignup(){
 const e=document.getElementById('au_e').value.trim(), p=document.getElementById('au_p').value;
 if(!e||p.length<6)return toast('이메일과 6자 이상 비밀번호를 입력해주세요');
 if(!SB&&!(await initSB()))return toast(SYNCERR||'연결 준비 실패');
 SYNCERR='';
 const {data,error}=await SB.auth.signUp({email:e,password:p});
 if(error){SYNCERR=error.message;render();return toast('가입 실패')}
 if(!data.session){SYNCERR='메일 인증이 켜져 있습니다. Supabase 설정에서 Confirm email을 꺼주세요.';render();return}

/* ================= 뒤로가기 (브라우저 · 안드로이드 제스처) =================
   지금까지는 방문 기록을 전혀 남기지 않아서 뒤로가기를 누르면 앱이 그대로 닫혔습니다.
   화면을 옮길 때마다 방문 기록을 남기고 뒤로가기를 가로채
   시트 닫기 → 이전 화면 → 홈 순으로 되돌아가게 합니다.
   홈에서 뒤로가기를 두 번 누르면 그때 닫힙니다. */

let NAVon=false, NAVi=0, NAVexit=0;
const sheetOpen=()=>{const m=document.getElementById('mk');return !!(m&&m.classList.contains('on'))};
function navState(){
 return {app:1,i:NAVi,view:view,day:selDate,
  tag:(typeof openTagId!=='undefined'?openTagId:''),sheet:sheetOpen()?1:0};
}
function navPush(){
 if(!NAVon)return;
 NAVi++;
 try{history.pushState(navState(),'')}catch(_){NAVi--}
}
function navReplace(){
 if(!NAVon)return;
 try{history.replaceState(navState(),'')}catch(_){}
}

/* ---- 화면 이동에 방문 기록 남기기 ---- */
const _go=go;
go=function(v){
 const same=(v===view);
 NAVexit=0;                 /* 다른 화면으로 옮기면 종료 확인을 초기화 */
 _go(v);
 if(same)navReplace(); else navPush();
};
/* openDay · openTag 는 내부에서 go() 를 부르므로 중복 기록을 막고
   상태(날짜 · 태그)만 현재 기록에 덮어씁니다. */
const _openDay=openDay;
openDay=function(k){
 const i0=NAVi, b=view+'|'+selDate;
 _openDay(k);
 if(NAVi!==i0)navReplace();
 else if(view+'|'+selDate!==b)navPush();
};
if(typeof openTag==='function'){
 const _openTag=openTag;
 openTag=function(id){
  const i0=NAVi;
  _openTag(id);
  if(NAVi!==i0)navReplace();
 };
}

/* ---- 뒤로가기 처리 ---- */
function navPop(st){
 NAVi=(st&&typeof st.i==='number')?st.i:0;
 /* 1) 시트(입력창)가 열려 있으면 시트만 닫고 화면은 그대로 둔다 */
 if(sheetOpen()){
  try{VoiceManager.cancel()}catch(_){}
  try{document.getElementById('mk').classList.remove('on')}catch(_){}
  navPush();
  return;
 }
 /* 2) 기록이 있으면 그 화면으로 되돌린다 */
 if(st&&st.app){
  if(st.day)selDate=st.day;
  if(typeof openTagId!=='undefined'&&st.tag!==undefined)openTagId=st.tag;
  if(st.view&&V[st.view]){view=st.view;try{render()}catch(_){}
   try{document.getElementById('scr').scrollTop=0}catch(_){}}
  if(st.i>0)return;
 }else{
  /* 3) 기록이 없으면 홈으로 */
  if(view!=='home'){view='home';try{render()}catch(_){}}
 }
 /* 4) 맨 처음 화면. 브라우저는 페이지를 스스로 닫을 수 없으므로
       여기서는 안내만 하고, 한 번 더 누르면 브라우저가 알아서 나갑니다. */
 NAVexit=Date.now();
 try{toast('한 번 더 누르면 앱이 닫혀요')}catch(_){}
}
function navInit(){
 try{
  if(!window.history||!history.pushState)return;
  NAVon=true; NAVi=0;
  history.replaceState(navState(),'');
  navPush();
  window.addEventListener('popstate',e=>{try{navPop(e.state)}catch(_){}});
 }catch(_){NAVon=false}
}
/* 헤더 ‹ 버튼도 방문 기록을 따라간다 */
document.getElementById('bk').onclick=()=>{
 if(NAVon){try{history.back();return}catch(_){}}
 go(PARENT[view]||'cal');
};

   · Skin  : 디자인 언어      legacy / couple  (S.skin,  기본 legacy)
   · Theme : 밝기 모드        light / dark / system (S.theme, 기본 system)
   · 데이터는 일절 건드리지 않는다. html 의 data-skin / data-theme 속성만 바꾼다.
   ========================================================== */
const BUILD='2026-08-17 · CDS v15 (원본 일러스트)';
const SKINS=[
 ['legacy','🌸','Legacy','지금까지 쓰던 기존 디자인'],

const THEMES=[['light','☀️','화이트'],['dark','🌙','다크'],['system','🖥️','시스템 설정']];
function sysDark(){try{return window.matchMedia('(prefers-color-scheme:dark)').matches}catch(_){return false}}
function themeMode(){const t=S&&S.theme;return t==='dark'?'dark':t==='light'?'light':(sysDark()?'dark':'light')}
function skinName(){return (S&&S.skin)||'legacy'}
function applySkin(){
 const h=document.documentElement;
 h.setAttribute('data-skin',skinName());
 h.setAttribute('data-theme',themeMode());
 try{
  let m=document.querySelector('meta[name="theme-color"]');
  if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}
  m.content=getComputedStyle(h).getPropertyValue('--bg').trim()||'#FBEFF3';
 }catch(_){}
}
function setSkin(v){if(!SKINS.some(k=>k[0]===v))return;S.skin=v;save();applySkin();render();

function setTheme(v){if(['light','dark','system'].indexOf(v)<0)return;S.theme=v;save();applySkin();render();
 toast(v==='system'?'기기 설정을 따라가요':v==='dark'?'다크 모드로 바꿨어요':'화이트 모드로 바꿨어요')}
try{const mq=window.matchMedia('(prefers-color-scheme:dark)');
 const f=()=>{if(S&&S.theme==='system'){applySkin();try{render()}catch(_){}}};

}catch(_){}

function emoIco(e){const k=(e||'').replace(/\uFE0F/g,'');const n=EMAP[k];return n?icoSvg(n):''}

/* ---- 렌더 후 아이콘 치환 (템플릿을 건드리지 않는다) ---- */
const EMO_SRC='([\\u2300-\\u23FF\\u25A0-\\u27BF\\u2B00-\\u2BFF\\uD83C-\\uD83E][\\uDC00-\\uDFFF]?)\\uFE0F?';
const EMO_RE=()=>new RegExp(EMO_SRC,'g');
const SKIP_TAG={INPUT:1,TEXTAREA:1,SELECT:1,SCRIPT:1,STYLE:1,SVG:1};
function paintIcons(root){
 if(!coupleSkin())return;
 root=root||document.getElementById('scr'); if(!root)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
   const p=n.parentNode; if(!p||SKIP_TAG[p.nodeName]||p.closest('svg'))return NodeFilter.FILTER_REJECT;
   return EMO_RE().test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const hit=[]; let n; while((n=w.nextNode()))hit.push(n);
 hit.forEach(t=>{
  const html=t.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
   .replace(EMO_RE(),(m,g)=>{const s=emoIco(g);return s||m});
  if(html===t.nodeValue)return;
  const sp=document.createElement('span'); sp.className='icowrap'; sp.innerHTML=html;
  t.parentNode.replaceChild(sp,t);
 });
}

/* ================= Couple v3 : 채움 아이콘 · 삽화 · 헤더 · 메뉴 정리 ================= */
/* 1) 아이콘을 파스텔 채움형으로 : 닫힌 도형에만 fill 을 넣는다 (선은 그대로) */
const ICO_CACHE={};
function icoFill(inner){
 return inner.replace(/<(path|rect|circle|ellipse|polygon)\b([^>]*)>/g,(m,tag,at)=>{
  if(/fill=/.test(at))return m;
  let closed = tag!=='path';
  if(tag==='path'){const d=(at.match(/d="([^"]*)"/)||[])[1]||'';closed=/[zZ]\s*$/.test(d.trim())}
  if(/class="f"/.test(at))return m;
  const self=/\/\s*$/.test(at); const a2=at.replace(/\/\s*$/,'');
  return `<${tag}${a2} fill="${closed?'var(--ico-fill)':'none'}"${self?'/':''}>`;
 });
}
function icoSvg(name,cls,tint){
 const p=ICONS[name]; if(!p)return '';
 if(!ICO_CACHE[name])ICO_CACHE[name]=icoFill(p);
 const st=tint?` style="--ico-fill:${tint}"`:'';
 return `<svg class="ico${cls?' '+cls:''}"${st} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICO_CACHE[name]}</svg>`;
}

function icoFill5(inner){
 return inner.replace(/<(path|rect|circle|ellipse|polygon)\b([^>]*)>/g,(m,tag,at)=>{
  if(/fill=/.test(at))return m;
  let closed=tag!=='path';
  if(tag==='path'){const d=(at.match(/d="([^"]*)"/)||[])[1]||'';closed=/[zZ]\s*$/.test(d.trim())}
  if(/class="f"/.test(at))return m;
  const self=/\/\s*$/.test(at); const a2=at.replace(/\/\s*$/,'');
  return `<${tag}${a2} fill="${closed?'var(--ico-tint)':'none'}"${self?'/':''}>`;
 });
}
function icoSvg(name,cls,tint){
 const p=ICONS[name]; if(!p)return '';

 return `<svg class="ico${cls?' '+cls:''}" style="--ico-tint:${t}" viewBox="0 0 24 24" fill="none"

/* ---- CDS v12 : 아바타(얼굴만) · 화면별 빈 상태 캐릭터 ---- */
function chrHead(who,s){
 s=s||26; const w=(who==='you'||who==='roki'||who==='m');
 const cloth=w?'var(--you)':'var(--me)', hair=w?'var(--hair-m)':'var(--hair-w)', kind=w?'m':'w';
 return `<svg class="chr chrhead" width="${s}" height="${s}" viewBox="12 8 40 34" fill="none">
  ${chrFig(cloth,hair,kind,{bag:false})}</svg>`;
}
function avaMini(p){return `<span class="ava ${p}">${chrHead(p==='me'?'me':'you',26)}</span>`}
const EMPTY_POSE={list:'write',cal:'cal',led:'money',map:'map',search:'empty',
 bucket:'party',goals:'done',trip:'travel',life:'check',album:'photo',stats:'happy',
 home:'hi',more:'hi',tags:'happy',anniv:'party',body:'happy',fixed:'money',budget:'money'};
const EMPTY_HINT=['기록이 쌓이면','한 번에 찾아요','함께 가고 싶은','함께할 목표','여행 기간을 등록','모두 끝냈어요',
 '아직 기록이 없어요','없어요','비어 있어요','등록된','기록해보세요','적어보세요','만들어보세요'];
function paintEmpty(root){
 if(!coupleSkin())return;
 root=root||document.getElementById('scr'); if(!root)return;
 const pose=EMPTY_POSE[view]||'base';
 let el=root.querySelector('.empty');
 if(!el){
  const cand=[...root.querySelectorAll('div,p,span')].filter(e=>{
   if(e.children.length)return false;
   if(e.closest('.hcard,.hgrid,.hgreet,.hstat,.qk,.hrec,.hev,.bs,.exp,.row,.lc,.grid,.filters,.whobar,.seg'))return false;
   const t=(e.textContent||'').trim();
   if(t.length<8||t.length>48)return false;
   return EMPTY_HINT.some(h=>t.includes(h));
  });
  el=cand[0];
  if(el&&!el.classList.contains('empty'))el.classList.add('emptyish');
 }
 if(!el||el.dataset.chr)return;
 el.dataset.chr='1';
 el.insertAdjacentHTML('beforebegin',`<div class="emptychr">${chrCouple(150,pose)}</div>`);
}

}

 s=s||26; const w=(who==='you'||who==='roki'||who==='m');

}

/* ==================================================================
   UX 구조 개편 (기능 추가·삭제 없음 · 위치와 우선순위만 재설계)
   · 하단 : 홈 · 캘린더 · 다이어리 · 가계부 · 지도 · 더보기
   · 하루(Day View)를 앱 전체의 중심 허브로
   · 더보기를 우리 / 생활 / 돈 / 기록 / 설정 다섯 묶음으로
   ================================================================== */

/* ---------- 하루 요약 (여러 화면 공용) ---------- */
function tripsOn(k){return (S.trips||[]).filter(t=>t.start&&t.end&&k>=t.start&&k<=t.end)}
function dayCarRows(k){
 const out=[];
 const o=S.days[k];
 (o&&o.exp||[]).forEach(e=>{if(e.car)out.push({e,c:e.car,a:isOut(e)?e.a:0})});
 try{(S.carlogs||[]).forEach(l=>{if(l.date===k)out.push({l,c:l,a:0})})}catch(_){}
 return out;
}
function daySumm(k){
 const o=S.days[k]||{};
 return {ev:eventsOn(k).length,
  exp:(o.exp||[]).length,
  ph:(o.photos||[]).length,
  di:Object.values(o.diary||{}).filter(v=>v&&v.text).length,
  pl:(o.places||[]).length,
  car:dayCarRows(k).length};
}
function dayChips(k){
 const s=daySumm(k), a=[];
 if(s.ev)a.push('일정 '+s.ev);
 if(s.di)a.push('일기 '+s.di);
 if(s.ph)a.push('사진 '+s.ph);
 if(s.exp)a.push('지출 '+s.exp);
 if(s.car)a.push('차량 '+s.car);
 if(s.pl)a.push('장소 '+s.pl);
 return a.join(' · ');
}
/* 특별한 날 : 기념일 · 여행 기간 · 사진이 많은 날 */
function isSpecialDay(k){
 const o=S.days[k]||{};
 if(annivOn(k).length)return true;
 if(tripsOn(k).length)return true;
 if((o.photos||[]).length>=3)return true;
 return false;
}

/* ---------- 통합검색 : 갈래 나누기 ---------- */
let SFILT='all';
const SFILTS=[['all','전체'],['diary','다이어리'],['ev','일정'],['exp','지출'],['place','장소'],['car','차량']];
function setSFilt(v){SFILT=v;drawSearch()}
/* 결과에 갈래(g)를 붙인다 — 차량은 지출 결과에 합쳐 한 건으로만 보여준다 */
function tagResults(res){
 return res.map(r=>{
  const t=String(r.type||'');
  let g='etc';
  if(t.indexOf('일기')===0)g='diary';
  else if(t.indexOf('지출')===0)g='exp';
  else if(t.indexOf('일정')===0)g='ev';
  else if(t.indexOf('장소')===0)g='place';
  return Object.assign({},r,{g});
 });
}
function carHit(r,t){
 if(r.g!=='exp'||!r.k)return null;
 const o=S.days[r.k]; if(!o)return null;
 const has=x=>String(x||'').toLowerCase().includes(t.toLowerCase());
 const e=(o.exp||[]).find(x=>x.car&&has([x.name,x.cat,x.sub,(x.car.item||'')].join(' ')));
 return e||null;
}
function drawSearch(){
 const box=document.getElementById('sres'); if(!box)return;
 const t=(q||'').trim();
 const bar=`<div class="filters" style="margin-bottom:8px">${SFILTS.map(f=>
   `<div class="f ${SFILT===f[0]?'on':''}" onclick="setSFilt('${f[0]}')">${f[1]}</div>`).join('')}</div>`;
 if(!t){
  const tagsL=allTags('cnt').filter(x=>x.cnt).slice(0,24);
  box.innerHTML=`<div class="card" style="text-align:center;padding:26px"><div style="font-size:26px">💗</div>
   <div style="font-size:12.5px;color:var(--sub);margin-top:9px;font-weight:600">다이어리 · 일정 · 지출 · 장소 · 차량을 한 번에 찾아요</div></div>
   ${tagsL.length?`<div class="card"><div class="fl" style="margin-top:0">태그 <span class="more" onclick="go('tags')">관리 ›</span></div>
   <div style="display:flex;flex-wrap:wrap;gap:5px">${tagsL.map(x=>`<span class="tg" style="background:${tagColor(x.id)}1f;color:${tagColor(x.id)}" onclick="openTag('${x.id}')">#${esc(x.n)} ${x.cnt}</span>`).join('')}</div></div>`:''}`;
  return}
 let res=tagResults(searchResults(t));
 /* 차량 : 차계부와 연결된 지출만 골라낸다 (같은 데이터를 두 번 만들지 않는다) */
 res.forEach(r=>{const e=carHit(r,t); if(e){r.car=e; r.carTx=(()=>{try{
   return `🚗 ${carName(e.car.id)}${e.car.odo?' · '+comma(e.car.odo)+'km':''} · 가계부 ${e.cat}${e.sub?'/'+e.sub:''}에 연결됨`}catch(_){return '🚗 차계부와 연결됨'}})()}});
 if(SFILT==='car')res=res.filter(r=>r.car);
 else if(SFILT!=='all')res=res.filter(r=>r.g===SFILT);
 const rx=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
 const mark=x=>esc(x).replace(rx,m=>`<span class="hl">${m}</span>`);
 box.innerHTML=bar+`<div style="font-size:11.5px;color:var(--sub);padding:2px 4px 8px;font-weight:700">결과 ${res.length}건</div>`+
  (res.length?res.slice(0,200).map(r=>`<div class="card" style="cursor:pointer;padding:12px" onclick="${r.go}">
    <div style="font-size:11px;color:var(--sub);margin-bottom:5px;font-weight:700">${esc(r.type)}${r.k?' · '+r.k:''}</div>
    <div style="font-size:12.5px;line-height:1.6">${mark(String(r.tx).slice(0,120))}${String(r.tx).length>120?'…':''}</div>
    ${r.carTx?`<div style="font-size:10.5px;color:var(--our);font-weight:800;margin-top:6px">${esc(r.carTx)}</div>`:''}</div>`).join('')
  :`<div class="card" style="text-align:center;padding:30px"><div style="font-size:26px">🔍</div>
    <div style="font-size:12.5px;color:var(--sub);margin-top:9px;font-weight:600">검색 결과가 없어요</div></div>`);
}

/* ==================================================================
   금융거래 자동입력 (Transaction Candidate Pipeline)
   ------------------------------------------------------------------
   · 이 웹앱은 다른 앱의 알림을 읽지 않는다. Android 래퍼가
     window.RokiBokiFinance.receiveNotification(payload) 하나만 호출한다.
   · Candidate 는 기기 로컬 임시 데이터(S.finInbox). Supabase·백업에 가지 않는다.
   · 확정된 거래만 기존 S.days[날짜].exp 로 들어간다 (유일한 원본).
   ================================================================== */

/* ---------- 개인정보 : 카드·계좌번호 마스킹 ---------- */
function finRedact(s){
 return String(s==null?'':s)
  .replace(/\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{2,4}/g,m=>'****-****-****-'+m.replace(/\D/g,'').slice(-4))
  .replace(/\d{6,}/g,m=>'*'.repeat(Math.max(1,m.length-4))+m.slice(-4));
}
/* ---------- 상호 정규화 ---------- */
function merchNorm(s){
 let x=String(s==null?'':s).trim();
 if(!x)return '';
 const o=x;
 x=x.replace(/\(주\)|주식회사|㈜|\(유\)/g,' ');
 x=x.replace(/코리아|KOREA/gi,' ');
 x=x.replace(/\s*\d+\s*호?점$/,'');
 x=x.replace(/\s*[가-힣A-Za-z0-9]{1,8}(점|지점|매장)$/,'');
 x=x.replace(/[\[\]()]/g,' ').replace(/\s{2,}/g,' ').trim();
 return x||o;
}
/* ---------- 카드 매칭 (기존 cardByIssuer 는 완전일치라 래퍼로 보강) ---------- */
function finCardMatch(org){
 const o=String(org||'').trim();
 const R={type:'card',issuer:'',cardId:''};
 if(!o)return R;
 let c=null;
 try{c=cardByIssuer(o)}catch(_){}
 if(!c){
  const n=catNorm(o);
  c=(S.cards||[]).find(x=>{
   const a=catNorm(x.name||''), b=catNorm(x.issuer||'');
   return (a&&a.length>=2&&(n.indexOf(a)>=0||a.indexOf(n)>=0))
       || (b&&b.length>=2&&(n.indexOf(b)>=0||b.indexOf(n)>=0));
  })||null;
 }
 let iss='';
 if(c){ if((S.pay.card||[]).indexOf(c.name)>=0)iss=c.name;
        else if((S.pay.card||[]).indexOf(c.issuer)>=0)iss=c.issuer; }
 if(!iss){
  const n=catNorm(o);
  iss=(S.pay.card||[]).find(x=>{const a=catNorm(x);
   return a&&a.length>=2&&(n.indexOf(a)>=0||a.indexOf(n)>=0)})||'';
 }
 R.issuer=iss||o.replace(/카드$/,'');
 R.cardId=c?c.id:'';
 return R;
}

/* ================= Parser Adapter =================
   실제 금융앱 알림 샘플을 아직 확보하지 않았으므로
   mock 3종 + generic 2종만 둔다. 기관 추가는 FIN_PARSERS 에 한 줄이면 된다.
   ================================================== */
const FIN_NOISE=/^(승인|취소|결제|사용|입금|출금|이체|일시불|누적|잔액|한도|체크|신용|이용|알림|안내|정상|완료)$/;
function finBody(p){return [p&&p.title,p&&p.text,p&&p.subText].filter(Boolean).join('\n')}
function finAmt(s){
 const m=String(s).match(/([\d][\d,]*)\s*원/);
 return m?(+m[1].replace(/,/g,'')||0):0;
}
function finInst(s){const m=String(s).match(/(\d{1,2})\s*개월/);return m?+m[1]:0}
function finWhen(s,ts){
 const base=ts?new Date(ts):new Date();
 const m=String(s).match(/(\d{1,2})\s*[\/월.\-]\s*(\d{1,2})\s*일?\s*(?:\([^)]*\)\s*)?(\d{1,2}):(\d{2})/);
 if(m){
  const d=new Date(base.getFullYear(),+m[1]-1,+m[2],+m[3],+m[4],0,0);
  if(d-base>7*864e5)d.setFullYear(d.getFullYear()-1);
  return {d,hasTime:true};
 }
 const md=String(s).match(/(\d{1,2})\s*[\/월.\-]\s*(\d{1,2})\s*일?/);
 if(md){
  const d=new Date(base.getFullYear(),+md[1]-1,+md[2],0,0,0,0);
  if(d-base>7*864e5)d.setFullYear(d.getFullYear()-1);
  return {d,hasTime:false};
 }
 const hm=String(s).match(/(\d{1,2}):(\d{2})/);
 if(hm){const d=new Date(base);d.setHours(+hm[1],+hm[2],0,0);return {d,hasTime:true}}
 return {d:base,hasTime:!!ts};
}
function finPickMerchant(body,org){
 const on=catNorm(org||'');
 const L=String(body).split('\n').map(x=>x.trim()).filter(Boolean);
 const cand=L.filter(x=>{
  if(FIN_NOISE.test(x))return false;
  if(/원\s*$/.test(x))return false;
  if(/\d{1,2}\s*[\/월]\s*\d{1,2}/.test(x))return false;
  if(/^\d{1,2}:\d{2}$/.test(x))return false;
  if(/님\s*$/.test(x))return false;
  if(/개월/.test(x))return false;
  if(on&&catNorm(x).indexOf(on)>=0)return false;
  if(x.length>34)return false;
  return true;
 });
 return cand.length?cand[cand.length-1].replace(/^[\[\(]|[\]\)]$/g,'').trim():'';
}
/* 카드 알림 (mock) */
function finCardParse(p,org){
 const b=finBody(p);
 const a=finAmt(b);
 const w=finWhen(b,p&&p.timestamp);
 const cancel=/취소/.test(b);
 return {t:'out', a, org:org||(String(b.match(/([가-힣A-Za-z]{2,10}카드)/)&&RegExp.$1||'')||'카드'),
   orgKind:'card', merchant:finPickMerchant(b,org),
   date:key(w.d), ts:w.hasTime?w.d.getTime():0,
   instMonth:finInst(b), ext:(p&&p.externalId)||'',
   cancel, rawHint:cancel||!a?b:''};
}
/* 은행 알림 (mock) */
function finBankParse(p,org){
 const b=finBody(p);
 const a=finAmt(b);
 const w=finWhen(b,p&&p.timestamp);
 const isIn=/입금/.test(b);
 const isTr=/이체/.test(b)&&/내\s*계좌|본인|자동이체/.test(b);
 const t=isTr?'tr':(isIn?'in':'out');
 let mer='';
 const line=String(b).split('\n').map(x=>x.trim()).find(x=>/입금|출금|이체/.test(x))||'';
 if(line){
  mer=line.replace(/[\d][\d,]*\s*원/g,' ')
          .replace(/입금|출금|이체|잔액.*$/g,' ')
          .replace(/[\[\]()]/g,' ').replace(/\s{2,}/g,' ').trim();
 }
 if(!mer)mer=finPickMerchant(b,org);
 return {t, a, org:org||(String(b.match(/([가-힣A-Za-z]{2,10}(?:은행|뱅크))/)&&RegExp.$1||'')||'은행'),
   orgKind:'bank', merchant:mer, date:key(w.d), ts:w.hasTime?w.d.getTime():0,
   instMonth:0, ext:(p&&p.externalId)||'', rawHint:a?'':b};
}
const FIN_PARSERS={
 hyundaiCard:{label:'현대카드', kind:'card', mock:true,
  match:p=>/현대카드|hyundaicard|com\.hyundaicard/i.test(finBody(p)+' '+((p&&p.appName)||'')+' '+((p&&p.packageName)||'')),
  parse:p=>finCardParse(p,'현대카드')},
 samsungCard:{label:'삼성카드', kind:'card', mock:true,
  match:p=>/삼성카드|samsungcard|com\.samsungcard/i.test(finBody(p)+' '+((p&&p.appName)||'')+' '+((p&&p.packageName)||'')),
  parse:p=>finCardParse(p,'삼성카드')},
 kbBank:{label:'KB국민은행', kind:'bank', mock:true,
  match:p=>/KB국민은행|국민은행|kbstar|com\.kbstar/i.test(finBody(p)+' '+((p&&p.appName)||'')+' '+((p&&p.packageName)||'')),
  parse:p=>finBankParse(p,'KB국민은행')},
 genericCard:{label:'카드 (일반)', kind:'card', mock:false,
  match:p=>/카드|card/i.test(finBody(p)+' '+((p&&p.appName)||''))&&/승인|결제|사용|취소/.test(finBody(p)),
  parse:p=>finCardParse(p,'')},
 genericBank:{label:'은행 (일반)', kind:'bank', mock:false,
  match:p=>/은행|뱅크|bank/i.test(finBody(p)+' '+((p&&p.appName)||''))||/입금|출금/.test(finBody(p)),
  parse:p=>finBankParse(p,'')}
};
const FIN_ORDER=['hyundaiCard','samsungCard','kbBank','genericCard','genericBank'];
function finParse(p){
 for(let i=0;i<FIN_ORDER.length;i++){
  const k=FIN_ORDER[i], P=FIN_PARSERS[k];
  try{ if(P.match(p)){const r=P.parse(p); if(r){r._parser=k; return r}} }catch(_){}
 }
 return null;
}

/* ================= Candidate Pipeline ================= */
function finInbox(){if(!Array.isArray(S.finInbox))S.finInbox=[];return S.finInbox}
function finLocal(){if(!S.finLocal||typeof S.finLocal!=='object')S.finLocal=defFinLocal();return S.finLocal}
function finSet(){if(!S.finSet||typeof S.finSet!=='object')S.finSet=defFinSet();return S.finSet}
function defFinLocal(){return {on:false,mode:'review',profile:(S&&S.profile)||'me',device:'',perm:false,dev:false,lastAt:0}}
function defFinSet(){return {learn:true,carSuggest:true,defScope:'ask'}}

function normalizeCandidate(raw,src,owner){
 const L=finLocal();
 const prof=(owner==='me'||owner==='you')?owner:(L.profile||S.profile||'me');
 const ts=+raw.ts||0;
 const d=ts?new Date(ts):new Date();
 const c={
  cid:'fc'+uid(), src:src||'notification', status:'ready',
  owner:prof, device:L.device||'',
  t:(raw.t==='in'||raw.t==='tr')?raw.t:'out',
  date:raw.date||key(d), ts,
  a:Math.abs(+raw.a||0),
  merchant:String(raw.merchant||'').trim(), merchantN:'',
  org:String(raw.org||'').trim(), orgKind:raw.orgKind==='bank'?'bank':'card',
  pay:null, by:prof, sc:'', cat:'', sub:'', conf:0, why:'',
  carId:'', carKind:'', odo:0, memo:'', tags:[],
  instMonth:+raw.instMonth||0,
  ext:String(raw.ext||''), fp:'', dup:null, dupRef:'',
  err:[], test:!!raw.test, rawHint:'', txId:'',
  parser:raw._parser||'', at:Date.now()
 };
 c.merchantN=merchNorm(c.merchant);
 c.pay = c.orgKind==='card' ? finCardMatch(c.org)
       : {type:'cash', issuer:c.org||'', cardId:''};
 const ds=finSet().defScope||'ask';
 c.sc = (ds==='our'||ds==='per') ? ds : '';
 if(raw.rawHint)c.rawHint=finRedact(raw.rawHint).slice(0,120);
 if(raw.cancel)c.memo='취소 알림으로 보입니다. 확인해주세요';
 return c;
}
function validateCandidate(c){
 const e=[];
 if(!c.a||c.a<=0)e.push('금액을 읽지 못했어요');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(c.date||''))e.push('날짜를 읽지 못했어요');
 if(['out','in','tr'].indexOf(c.t)<0)e.push('거래 유형을 알 수 없어요');
 if(!String(c.merchant||'').trim())e.push('내용을 읽지 못했어요');
 c.err=e;
 if(e.length)c.status='review';
 return c;
}
function finFP(c){
 let hm='--:--';
 if(c.ts){const d=new Date(c.ts);hm=pad(d.getHours())+':'+pad(d.getMinutes())}
 return [catNorm(c.org),c.date,hm,c.a,catNorm(c.merchantN||c.merchant),c.t].join('|');
}
/* 3단계 : ext=dup / fp=probable / expSig=possible.  fp 만으로 자동 삭제하지 않는다 */
function dedupeCandidate(c){
 c.fp=finFP(c); c.dup=null; c.dupRef='';
 const box=finInbox().filter(x=>x.cid!==c.cid&&x.status!=='dropped');
 if(c.ext){
  const h=box.find(x=>x.ext&&x.ext===c.ext);
  if(h){c.dup='dup';c.dupRef=h.cid;return c}
  let ex=null; allExp(e=>{if(!ex&&e.externalId&&e.externalId===c.ext)ex=e});
  if(ex){c.dup='dup';c.dupRef=ex.id;return c}
 }
 const hf=box.find(x=>x.fp&&x.fp===c.fp);
 let exf=null; allExp(e=>{if(!exf&&e.fingerprint&&e.fingerprint===c.fp)exf=e});
 if(hf||exf){
  c.dup = c.ts ? 'probable' : 'possible';
  c.dupRef = (hf&&hf.cid) || (exf&&exf.id) || '';
  if(c.dup==='probable')return c;
 }
 try{
  const sig=expSig(candidateToTx(c,true));
  let exs=null; allExp(e=>{if(!exs&&expSig(e)===sig)exs=e});
  if(exs){c.dup=c.dup||'possible'; c.dupRef=c.dupRef||exs.id}
 }catch(_){}
 return c;
}
function classifyCandidate(c){
 if(c.t!=='out'){
  const L=catsFor(c.t);
  if(!c.cat||!L.some(x=>x.n===c.cat)){c.cat=(L[0]||{}).n||'기타';c.sub=''}
  if(c.t==='in'&&/급여|월급|상여|salary/i.test(c.merchant)){
   if((S.incomeCats||[]).some(x=>x.n==='급여'))c.cat='급여';
  }
  c.conf=0.5; c.why='';
  return c;
 }
 let g=null;
 try{g=guessCat({text:c.merchantN||c.merchant,place:null,pay:c.pay})}catch(_){}
 if(!g&&c.merchantN!==c.merchant){try{g=guessCat({text:c.merchant,place:null,pay:c.pay})}catch(_){}}
 if(g){c.cat=g.cat;c.sub=g.sub||'';c.conf=Math.max(.25,Math.min(.99,(g.score||2)/6));c.why=g.why||''}
 else{c.cat=(S.cats[S.cats.length-1]||{}).n||'기타';c.sub='';c.conf=.15;c.why='분류를 찾지 못했어요'}
 c.carId='';c.carKind='';
 try{
  if(finSet().carSuggest&&c.cat===CARCAT&&cars().length){
   const k=(CARKINDS.find(x=>x[3]&&x[3]===c.sub)||['etc'])[0];
   const cc=curCar(); c.carId=cc?cc.id:cars()[0].id; c.carKind=k;
  }
 }catch(_){}
 return c;
}
/* Candidate → 기존 거래 객체 (preview=true 면 저장용 metadata 없이) */
function candidateToTx(c,preview){
 const tx={
  id:preview?'_p':uid(), date:c.date, t:c.t, a:c.a,
  cat:c.cat, sub:c.sub||'', icon:(catOf(c.cat,c.t)||{}).e||'📦',
  by:c.by, sc:(c.t==='in'||c.t==='tr')?'per':(c.sc||'our'),
  pay:JSON.parse(JSON.stringify(c.pay||{type:'cash',issuer:''})),
  place:null, name:c.merchant, memo:c.memo||'', tags:(c.tags||[]).slice(),
  goalId:'', tripId:'', priv:false, bnf:false, bnfAmt:0,
  inst:+c.instMonth||0, instFree:false, cancel:0, at:Date.now()
 };
 if(!preview){
  tx.source=c.src||'notification';
  tx.institution=c.org||'';
  tx.externalId=c.ext||'';
  tx.fingerprint=c.fp||'';
  tx.importedAt=Date.now();
  if(c.merchantN&&c.merchantN!==c.merchant)tx.originalMerchant=c.merchant;
  if(c.carId)tx.car={id:c.carId,kind:c.carKind||'etc',odo:+c.odo||0,diary:false};
 }
 return tx;
}
/* 오래된 것만 정리 : 미처리(ready/review)는 지우지 않는다 */
function finPrune(){
 const now=Date.now(), D14=14*864e5, D7=7*864e5;
 S.finInbox=finInbox().filter(c=>{
  if(c.status==='committed'||c.status==='dropped')return (now-(c.at||0))<D14;
  return true;
 });
 S.finInbox.forEach(c=>{if(c.rawHint&&(now-(c.at||0))>D7)c.rawHint=''});
}
function finNeedScope(c){return finSet().defScope==='ask'&&c.t==='out'&&!c.sc}
function finReady(c){return !(c.err&&c.err.length)&&!finNeedScope(c)&&c.dup!=='probable'}
function finPending(){return finInbox().filter(c=>c.status==='ready'||c.status==='review')}

/* 확정 : 기존 저장 계층(commitTx) 사용 */
function finCommitOne(cid,silent){
 const c=finInbox().find(x=>x.cid===cid); if(!c)return null;
 if(c.err&&c.err.length){if(!silent)toast('필수 정보가 비어 있어요');return null}
 if(finNeedScope(c)){if(!silent)toast('공동 / 개인을 골라주세요');return null}
 const tx=candidateToTx(c,false);
 const saved=commitTx(tx,{learn:!!finSet().learn, learnText:(c.merchantN||c.merchant)});
 c.status='committed'; c.txId=saved.id; c.at=Date.now(); c.rawHint='';
 return saved;
}
function finDrop(cid){
 const c=finInbox().find(x=>x.cid===cid); if(!c)return;
 c.status='dropped'; c.at=Date.now(); c.rawHint='';
 save(); if(FINSEL===cid)FINSEL=''; render(); toast('제외했어요');
}

/* ================= 수신 진입점 ================= */
function finReceive(payload){
 try{
  const L=finLocal();
  /* 사용자가 '사용 안 함'으로 둔 기기에서는 후보를 만들지 않는다.
     Android 브리지가 실수로 불러도 여기서 막힌다. 개발용 테스트만 예외. */
  if(!L.on && !(payload&&payload.test))return {ok:false,reason:'disabled'};
  const raw=finParse(payload||{});
  if(!raw)return {ok:false,reason:'no-parser'};
  let c=normalizeCandidate(raw,(payload&&payload.src)||'notification',(payload&&payload.deviceProfile)||L.profile);
  if(payload&&payload.test)c.test=true;
  c=validateCandidate(c);
  c=dedupeCandidate(c);
  if(c.dup==='dup')return {ok:false,reason:'duplicate',dup:'dup',ref:c.dupRef};
  c=classifyCandidate(c);
  if(c.dup==='probable')c.status='review';
  finInbox().push(c);
  let committed=null;
  if(L.mode==='auto'&&c.status==='ready'&&finReady(c)){
   committed=finCommitOne(c.cid,true);
  }
  L.lastAt=Date.now();
  finPrune(); save();
  try{if(view==='fininbox'||view==='led'||view==='finset')safeRender()}catch(_){}
  return {ok:true,cid:c.cid,status:c.status,dup:c.dup,committed:!!committed,
          cat:c.cat,sub:c.sub,amount:c.a};
 }catch(_){ return {ok:false,reason:'error'} }
}
window.RokiBokiFinance={
 version:1,
 receiveNotification:finReceive,
 isEnabled:()=>!!finLocal().on,
 pendingCount:()=>finPending().length
};

/* ==================================================================
   음성 입력 (STEP 1 · 2)  —  받아쓰기만. 자연어 해석은 아직 없다.
   ------------------------------------------------------------------
   · STT Provider 와 UI 를 분리해 두어 Android 네이티브 STT 로 갈아끼울 수 있다.
   · 음성 원본도, 인식 원문도 저장하지 않는다. 입력칸에 넣고 메모리에서 지운다.
   · 시트가 닫히거나 화면이 바뀌거나 앱이 가려지면 즉시 마이크를 끈다.
   ================================================================== */

const VOICE_INTENTS=['diary','expense','income','transfer','schedule','car','text','unknown'];/* STEP 3 예약 */
function defVoiceLocal(){return {on:true,lang:'ko-KR',provider:'web'}}
function voiceLocal(){if(!S.voiceLocal||typeof S.voiceLocal!=='object')S.voiceLocal=defVoiceLocal();return S.voiceLocal}

const VSR=(typeof window!=='undefined')&&(window.SpeechRecognition||window.webkitSpeechRecognition);
function voiceSecure(){
 try{const h=location.hostname;
  return location.protocol==='https:'||h==='localhost'||h==='127.0.0.1'||h==='[::1]';
 }catch(_){return false}
}
/* 브라우저가 지원하고, 보안 환경이고, 사용자가 켜 두었을 때만 마이크를 보여준다 */
function voiceSupported(){return !!VSR&&voiceSecure()}
function voiceOK(){try{return voiceSupported()&&voiceLocal().on!==false}catch(_){return false}}
function voiceWhyOff(){
 if(!VSR)return '이 브라우저는 음성 인식을 지원하지 않아요';
 if(!voiceSecure())return '보안 주소(https)로 접속해야 마이크를 쓸 수 있어요';
 if(voiceLocal().on===false)return '설정에서 음성 입력을 꺼두셨어요';
 return '';
}

/* ---------- Provider (교체 가능) ---------- */
const VoiceProviders={
 web:{
  label:'브라우저 음성인식', _r:null,
  available(){return voiceSupported()},
  start(o){
   if(!this.available())return false;
   this.cancel();
   let r=null;
   try{r=new VSR()}catch(_){return false}
   try{
    r.lang=voiceLocal().lang||'ko-KR';
    r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
   }catch(_){}
   r.onstart=()=>{try{o.onStart&&o.onStart()}catch(_){}};
   r.onresult=e=>{
    let fin='',itm='';
    for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript;
     if(e.results[i].isFinal)fin+=t; else itm+=t;
    }
    try{ if(itm&&o.onInterim)o.onInterim(itm);
         if(fin&&o.onResult)o.onResult(fin); }catch(_){}
   };
   r.onerror=e=>{try{o.onError&&o.onError((e&&e.error)||'error')}catch(_){}};
   r.onend=()=>{this._r=null;try{o.onEnd&&o.onEnd()}catch(_){}};
   this._r=r;
   try{r.start()}catch(_){this._r=null;return false}
   return true;
  },
  stop(){try{this._r&&this._r.stop()}catch(_){}},
  cancel(){
   const r=this._r; this._r=null;
   if(!r)return;
   try{r.onresult=null;r.onend=null;r.onerror=null;r.onstart=null}catch(_){}
   try{r.abort()}catch(_){try{r.stop()}catch(__){}}
  }
 }
 /* native: Android 래퍼가 setProvider('native') 로 갈아끼운다 */
};

/* ---------- Manager ---------- */
const VoiceManager={
 state:'idle',      /* idle | listening | processing | review | error */
 provider:'web',
 ctx:null, text:'', err:'',
 prov(){return VoiceProviders[this.provider]||VoiceProviders.web},
 available(){try{return !!this.prov().available()}catch(_){return false}},
 setState(st){this.state=st;try{voicePaint()}catch(_){}},
 start(ctx){
  if(this.state==='listening')return false;
  if(!voiceOK()){const w=voiceWhyOff();if(w)toast(w);return false}
  this.ctx=ctx||null; this.text=''; this.err='';
  this.setState('listening');
  const ok=this.prov().start({
   onStart:()=>{this.setState('listening')},
   onInterim:t=>{this.text=String(t||'').slice(0,120);try{voicePaint()}catch(_){}},
   onResult:t=>{this.setState('processing');this.text='';voiceDone(t)},
   onError:c=>{this.err=c;this.setState('error');voiceErr(c)},
   onEnd:()=>{if(this.state==='listening'){this.ctx=null;this.text='';this.setState('idle')}}
  });
  if(ok===false){this.ctx=null;this.setState('idle');toast('마이크를 시작하지 못했어요');return false}
  return true;
 },
 stop(){try{this.prov().stop()}catch(_){}},
 cancel(){
  try{this.prov().cancel()}catch(_){}
  this.ctx=null; this.text=''; this.err='';
  try{VREV=null}catch(_){}          /* 확인 대기중이던 해석도 함께 버린다 */
  if(this.state!=='idle')this.setState('idle');
 }
};
/* Android 브리지 : 네이티브 STT 결과를 이 셋으로만 넘기면 된다 */
window.RokiBokiVoice={
 version:1,
 pushResult(text){ if(VoiceManager.state==='idle')return false;
   VoiceManager.setState('processing'); VoiceManager.text=''; voiceDone(text); return true },
 pushInterim(text){ if(VoiceManager.state!=='listening')return false;
   VoiceManager.text=String(text||'').slice(0,120); try{voicePaint()}catch(_){} return true },
 pushError(code){ VoiceManager.err=code||'error'; VoiceManager.setState('error'); voiceErr(code||'error'); return true },
 setProvider(name){ if(VoiceProviders[name]){VoiceManager.cancel();VoiceManager.provider=name;
   try{voiceLocal().provider=name;save()}catch(_){} return true} return false },
 state(){return VoiceManager.state},
 isEnabled(){return voiceOK()}
};

/* ---------- 결과 처리 ---------- */
function voiceDone(t){
 const c=VoiceManager.ctx;
 const txt=String(t||'').trim();
 try{
  if(!txt){toast('들은 내용이 없어요')}
  else if(c&&c.mode==='cmd'){voiceCommand(txt)}
  else if(c&&c.el&&document.body.contains(c.el))voiceDictate(c.el,txt,c.kind);
  else toast('입력칸이 사라져서 넣지 못했어요');
 }catch(_){}
 VoiceManager.ctx=null; VoiceManager.text='';   /* 원문을 남기지 않는다 */
 /* 확인 화면이 떠 있으면 review 상태를 유지한다 */
 if(VoiceManager.state!=='review')VoiceManager.setState('idle');
}
function voiceErr(code){
 const m = (code==='not-allowed'||code==='service-not-allowed') ? '마이크 권한이 필요해요'
   : code==='no-speech' ? '음성을 인식하지 못했어요. 다시 말해주세요'
   : code==='audio-capture' ? '마이크를 찾지 못했어요'
   : code==='network' ? '인터넷 연결을 확인해주세요'
   : code==='aborted' ? '' : '음성을 인식하지 못했어요';
 if(m)toast(m);
 VoiceManager.ctx=null; VoiceManager.text='';
 setTimeout(()=>{if(VoiceManager.state==='error')VoiceManager.setState('idle')},1400);
}

/* ---------- 받아쓰기 ---------- */
/* 커서 위치에 끼워 넣는다. 기존 글자를 지우지 않는다. */
function voiceDictate(el,text,kind){
 if(!el)return false;
 const t=String(text||'').trim(); if(!t)return false;
 const v=String(el.value==null?'':el.value);
 let a=el.selectionStart, b=el.selectionEnd;
 if(typeof a!=='number'||typeof b!=='number'||a<0||a>v.length){a=v.length;b=v.length}
 if(b<a)b=a;
 const before=v.slice(0,a), after=v.slice(b);
 const sp = (before && !/\s$/.test(before) && !/^[.,!?)\]]/.test(t)) ? ' ' : '';
 const ins = sp+t;
 el.value = before+ins+after;
 const pos=(before+ins).length;
 try{el.selectionStart=el.selectionEnd=pos}catch(_){}
 voiceCommitField(el,kind);
 try{el.focus()}catch(_){}
 return true;
}
/* 기존 저장 경로로만 반영한다. 새 저장 함수를 만들지 않는다. */
function voiceCommitField(el,kind){
 try{
  if(el.id==='dtx'){setDiaryField(el,'text');return true}
  if(el.id==='dtitle'){setDiaryField(el,'title');return true}
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
 }catch(_){return false}
}

/* ---------- 마이크 버튼 ---------- */
const VOICE_MIC='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg>';
function voiceMicBtn(sel,label){
 if(!voiceOK())return '';
 return `<button type="button" class="micbtn" data-vt="${esc(sel||'')}" onclick="voiceTap(this)"
   aria-label="말로 입력">${VOICE_MIC}<span>${esc(label||'말로 입력')}</span></button>`;
}
function voiceMicRow(sel,label){
 if(!voiceOK())return '';
 return `<div class="microw">${voiceMicBtn(sel,label)}</div>`;
}
/* 버튼 기준으로 가장 가까운 입력칸을 찾는다 (익명 input/textarea 대응) */
function voiceTarget(btn){
 if(!btn)return null;
 const t=(btn.dataset&&btn.dataset.vt)||'';
 if(t&&/^[#.\[]/.test(t)){try{const e=document.querySelector(t);if(e)return e}catch(_){}}
 const okEl=n=>n&&/^(INPUT|TEXTAREA)$/.test(n.tagName)
   &&!/^(date|time|checkbox|radio|button|file|hidden)$/i.test(n.type||'');
 let n=btn.previousElementSibling;
 while(n){
  if(okEl(n))return n;
  if(n.querySelector){const q=[...n.querySelectorAll('input,textarea')].filter(okEl).pop();if(q)return q}
  n=n.previousElementSibling;
 }
 let p=btn.parentElement,hop=0;
 while(p&&hop<4){
  const L=[...p.querySelectorAll('input,textarea')].filter(okEl);
  if(L.length)return L[L.length-1];
  p=p.parentElement;hop++;
 }
 return null;
}
function voiceTap(btn){
 if(VoiceManager.state==='listening'){VoiceManager.stop();return}
 const el=voiceTarget(btn);
 if(!el){toast('입력칸을 찾지 못했어요');return}
 VoiceManager.start({el,kind:(btn.dataset&&btn.dataset.vk)||'',at:Date.now()});
}

/* ---------- 상태 표시 ---------- */
function voiceBarEl(){
 let el=document.getElementById('vbar');
 if(!el){el=document.createElement('div');el.id='vbar';el.className='vbar';
  try{document.body.appendChild(el)}catch(_){}}
 return el;
}
function voicePaint(){
 let el=null; try{el=voiceBarEl()}catch(_){return}
 const st=VoiceManager.state;
 if(st==='idle'||st==='review'){el.classList.remove('on');el.innerHTML='';}
 else{
  const lab = st==='listening'?'듣고 있어요…'
    : st==='processing'?'음성을 정리하고 있어요…'
    : st==='review'?'이렇게 기록할까요?' : '음성을 인식하지 못했어요';
  el.innerHTML=`<div class="vb">
    <span class="vdot ${st}"></span>
    <span class="vt"><b>${lab}</b>${VoiceManager.text?`<i>${esc(VoiceManager.text)}</i>`:''}</span>
    ${st==='listening'?`<button type="button" class="vbtn ok" onclick="VoiceManager.stop()">완료</button>`:''}
    <button type="button" class="vbtn" onclick="VoiceManager.cancel()">취소</button></div>`;
  el.classList.add('on');
 }
 try{document.querySelectorAll('.micbtn').forEach(b=>b.classList.toggle('on',st==='listening'))}catch(_){}
}

 }catch(_){}
})();

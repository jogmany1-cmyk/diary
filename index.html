function xoRange(r){
 const n=new Date();
 XO.range=r;
 if(r==='year'){XO.from=key(new Date(n.getFullYear(),0,1));XO.to=key(new Date(n.getFullYear(),11,31))}
 else if(r==='month'){XO.from=key(new Date(n.getFullYear(),n.getMonth(),1));XO.to=key(new Date(n.getFullYear(),n.getMonth()+1,0))}
 else if(r==='last'){XO.from=key(new Date(n.getFullYear(),n.getMonth()-1,1));XO.to=key(new Date(n.getFullYear(),n.getMonth(),0))}
 drawXO();
}
function xoRows(){
 const out=[];
 allExp((e,k)=>{
  if(XO.range!=='all'&&(k<XO.from||k>XO.to))return;
  if(XO.type!=='all'&&(e.t||'out')!==XO.type)return;
  if(XO.by!=='all'&&e.by!==XO.by)return;
  if(XO.scope!=='all'&&scopeOf(e)!==XO.scope)return;
  if(XO.cat&&e.cat!==XO.cat)return;
  if(XO.tag&&!(e.tags||[]).includes(XO.tag))return;
  out.push({e,k});
 });
 out.sort((a,b)=>a.k.localeCompare(b.k));
 return out;
}
function xoName(){
 const tg=XO.tag?'_'+tagName(XO.tag):'';
 const sc=XO.scope==='our'?'_공동':XO.scope==='per'?'_개인':'';
 const by=XO.by!=='all'?'_'+byName(XO.by):'';
 if(XO.range==='all')return `${S.names.me}_${S.names.you}_가계부_전체${by}${sc}${tg}.xlsx`;
 return `가계부_${XO.from}_${XO.to}${by}${sc}${tg}.xlsx`;
}
function xoGo(){
 loadXLSX(ok=>{
  if(!ok)return xlFail();
  const rows=xoRows();
  if(!rows.length)return toast('조건에 맞는 내역이 없어요');
  /* 시트1 상세 */
  const d1=[XCOLS];
  rows.forEach(({e,k})=>d1.push([k, e.t==='in'?'수입':'지출', e.name||'', e.a, e.cat, e.sub||'',
    byName(e.by), scopeOf(e)==='our'?'공동':'개인', payLabel(e),
    (e.place&&e.place.name)||'', (e.tags||[]).map(t=>'#'+tagName(t)).join(','), e.memo||'']));
  const ws1=XLSX.utils.aoa_to_sheet(d1);
  ws1['!cols']=[{wch:12},{wch:7},{wch:20},{wch:12},{wch:12},{wch:10},{wch:10},{wch:10},{wch:13},{wch:18},{wch:18},{wch:20}];
  ws1['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:d1.length-1,c:XCOLS.length-1}})};
  ws1['!freeze']={xSplit:0,ySplit:1};
  for(let r=1;r<d1.length;r++){const c=XLSX.utils.encode_cell({r,c:3});if(ws1[c])ws1[c].z='#,##0'}
  /* 시트2 월별 */
  const M={};
  rows.forEach(({e,k})=>{const ym=k.slice(0,7); M[ym]=M[ym]||{inn:0,out:0,our:0,per:0};
    if(e.t==='in')M[ym].inn+=e.a; else {M[ym].out+=e.a; if(scopeOf(e)==='our')M[ym].our+=e.a; else M[ym].per+=e.a}});
  const d2=[['월','수입','지출','공동지출','개인지출','합계']];
  Object.keys(M).sort().forEach(ym=>{const m=M[ym];d2.push([ym,m.inn,m.out,m.our,m.per,m.inn-m.out])});
  const tt=Object.values(M).reduce((a,b)=>({inn:a.inn+b.inn,out:a.out+b.out,our:a.our+b.our,per:a.per+b.per}),{inn:0,out:0,our:0,per:0});
  d2.push(['합계',tt.inn,tt.out,tt.our,tt.per,tt.inn-tt.out]);
  const ws2=XLSX.utils.aoa_to_sheet(d2); ws2['!cols']=[{wch:10},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14}];
  /* 시트3 카테고리별 */
  const C={};
  rows.forEach(({e})=>{if(e.t==='in')return;C[e.cat]=(C[e.cat]||0)+e.a});
  const ctot=Object.values(C).reduce((a,b)=>a+b,0)||1;
  const d3=[['카테고리','금액','비율','건수']];
  Object.keys(C).sort((a,b)=>C[b]-C[a]).forEach(c=>d3.push([c,C[c],Math.round(C[c]/ctot*1000)/10+'%',
    rows.filter(r=>r.e.cat===c&&r.e.t!=='in').length]));
  d3.push(['합계',ctot,'100%',rows.filter(r=>r.e.t!=='in').length]);
  const ws3=XLSX.utils.aoa_to_sheet(d3); ws3['!cols']=[{wch:14},{wch:14},{wch:9},{wch:8}];
  /* 시트4 태그별 */
  const T={};
  rows.forEach(({e})=>{(e.tags||[]).forEach(id=>{T[id]=T[id]||{a:0,n:0};if(e.t!=='in'){T[id].a+=e.a;T[id].n++}})});
  const d4=[['태그','지출액','건수']];
  Object.keys(T).sort((a,b)=>T[b].a-T[a].a).forEach(id=>d4.push(['#'+tagName(id),T[id].a,T[id].n]));
  if(d4.length===1)d4.push(['(태그 없음)',0,0]);
  const ws4=XLSX.utils.aoa_to_sheet(d4); ws4['!cols']=[{wch:18},{wch:14},{wch:8}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws1,'가계부 상세');
  XLSX.utils.book_append_sheet(wb,ws2,'월별 요약');
  XLSX.utils.book_append_sheet(wb,ws3,'카테고리별');
  XLSX.utils.book_append_sheet(wb,ws4,'태그별');
  let nm=(XO.name||'').trim()||xoName();
  if(!/\.xlsx$/i.test(nm))nm+='.xlsx';
  sheetToBlob(wb,nm);
  close_(); toast(comma(rows.length)+'건을 저장했어요');
 });
}


/* ================= Storage Service Layer =================
   DB에는 메타데이터만, 실제 파일은 Object Storage에.
   provider 를 파일마다 기록해두므로 나중에 R2/S3 로 점진 이전이 가능합니다. */

function defStorage(){return {provider:'supabase',bucket:'photos',migrating:false}}
function fileMeta(id){return (S.files||{})[id]||null}

/* 파일 메타데이터 등록 (file_id, storage_path, file_type, file_size, user_id, created_at) */
function registerFile(id,blob,extra){
 if(!S.files)S.files={};
 const prov=(S.storage&&S.storage.provider)||'supabase';
 const type=(blob&&blob.type)||'image/jpeg';
 const ext=type.indexOf('png')>=0?'png':type.indexOf('webp')>=0?'webp':type.indexOf('video')>=0?'mp4':'jpg';
 const sid=(S.sync&&S.sync.spaceId)||'local';
 const m=Object.assign({
  id, provider:prov, path:`${sid}/${id}.${ext}`,
  type, size:(blob&&blob.size)||0,
  owner:(S.sync&&S.sync.email)||'', slot:S.profile,
  created_at:new Date().toISOString(), updated_at:new Date().toISOString(),
  deleted_at:null, up:false
 },extra||{});
 const old=S.files[id]||{};
 /* 이미 있는 파일은 경로·공급자·생성일을 지킨다 (이전 중에도 원래 자리에서 열려야 함) */
 if(old.path)m.path=old.path;

/* ---- 공급자별 구현 ---- */
const StorageProviders={
 supabase:{
  label:'Supabase Storage',
  async put(id,blob,m){
   if(!SB)return false;
   const bucket=(S.storage&&S.storage.bucket)||'photos';
   const {error}=await SB.storage.from(bucket).upload(m.path,blob,{upsert:true,contentType:m.type||'image/jpeg'});
   return !error;
  },
  async get(id,m){
   if(!SB)return null;
   const bucket=(S.storage&&S.storage.bucket)||'photos';
   const {data,error}=await SB.storage.from(bucket).download(m.path);
   if(error||!data)return null;
   return data;
  },
  async del(id,m){
   if(!SB)return false;
   const bucket=(S.storage&&S.storage.bucket)||'photos';
   const {error}=await SB.storage.from(bucket).remove([m.path]);
   return !error;
  },
  async url(id,m){
   if(!SB)return null;
   const bucket=(S.storage&&S.storage.bucket)||'photos';
   const {data}=await SB.storage.from(bucket).createSignedUrl(m.path,3600);
   return (data&&data.signedUrl)||null;
  }
 },
 /* 앞으로 붙일 자리. 서명 URL을 내려주는 작은 서버(Edge Function)만 있으면 동작합니다. */
 r2:{label:'Cloudflare R2', async put(){return false}, async get(){return null},
     async del(){return false}, async url(){return null}},
 s3:{label:'AWS S3', async put(){return false}, async get(){return null},
     async del(){return false}, async url(){return null}}
};

const Storage={
 provider(id){
  const m=id?fileMeta(id):null;
  return (m&&m.provider)||(S.storage&&S.storage.provider)||'supabase';
 },
 impl(name){return StorageProviders[name]||StorageProviders.supabase},
 label(){return Storage.impl((S.storage&&S.storage.provider)||'supabase').label},

 /* 기기 안에 먼저 저장 + 메타데이터 등록 (오프라인에서도 동작) */
 async putLocal(blob,id,extra){
  Storage.lastDup=false;
  try{
   const h=await blobHash(blob);
   if(h){
    if(!S.fileHash)S.fileHash={};
    const old=S.fileHash[h];
    if(old&&S.files[old]&&!S.files[old].deleted_at){Storage.lastDup=true;return old}
    const fid0=id||('ph'+Date.now()+Math.random().toString(36).slice(2,7));
    await DB.set('p:'+fid0,(DB.mode==='idb')?blob:await blob2url(blob));
    registerFile(fid0,blob,Object.assign({hash:h},extra||{}));
    S.fileHash[h]=fid0;
    return fid0;
   }
  }catch(_){}
  const fid=id||('ph'+Date.now()+Math.random().toString(36).slice(2,7));
  await DB.set('p:'+fid,(DB.mode==='idb')?blob:await blob2url(blob));
  registerFile(fid,blob,extra||{});
  return fid;
 },
 /* 원격 업로드 (동기화 시 호출) */
 async push(id){
  const m=fileMeta(id)||registerFile(id,null);
  const b=await blobOf(id);
  if(!b)return false;
  if(!m.size)m.size=b.size;
  if(!m.type)m.type=b.type||'image/jpeg';
  const ok=await Storage.impl(m.provider).put(id,b,m);
  if(ok){m.up=true;m.updated_at=new Date().toISOString()}
  return ok;
 },
 /* 원격에서 받아 기기에 캐시 */
 async pull(id){
  let m=fileMeta(id);
  if(!m)m=registerFile(id,null);
  const blob=await Storage.impl(m.provider).get(id,m);
  if(!blob)return false;
  await DB.set('p:'+id,(DB.mode==='idb')?blob:await blob2url(blob));
  if(!m.size)m.size=blob.size;
  delete PHOTOS[id];
  return true;
 },
 async del(id){
  if(typeof fileRefs==='function'&&fileRefs(id)>0)return false;
  const m=fileMeta(id);
  if(m&&m.hash&&S.fileHash)delete S.fileHash[m.hash];
  await DB.del('p:'+id); delete PHOTOS[id];
  if(m){
   m.deleted_at=new Date().toISOString();
   try{await Storage.impl(m.provider).del(id,m)}catch(_){}
  }
  return true;
 },
 async url(id){
  const m=fileMeta(id); if(!m)return null;
  try{return await Storage.impl(m.provider).url(id,m)}catch(_){return null}
 },
 /* 사용량 집계 */
 usage(){
  const f=Object.values(S.files||{}).filter(x=>x&&!x.deleted_at);
  const byProv={};
  let size=0;
  f.forEach(x=>{size+=x.size||0;byProv[x.provider]=(byProv[x.provider]||0)+(x.size||0)});
  return {count:f.length,size,byProv,up:f.filter(x=>x.up).length};
 }
};
const humanSize=n=>{n=n||0;
 if(n>=1073741824)return (n/1073741824).toFixed(2)+'GB';
 if(n>=1048576)return (n/1048576).toFixed(1)+'MB';
 if(n>=1024)return (n/1024).toFixed(0)+'KB';
 return n+'B'};

/* 기존 사진 → 메타데이터 채우기 (1회) */
async function backfillFiles(){
 if(!S.files)S.files={};
 const ids=[];
 Object.values(S.days||{}).forEach(d=>(d.photos||[]).forEach(id=>ids.push(id)));
 (S.bucket||[]).forEach(b=>(b.photos||[]).forEach(id=>ids.push(id)));
 (S.body||[]).forEach(r=>{if(r.ph)ids.push(r.ph)});
 let n=0;
 for(const id of ids){
  if(S.files[id]&&S.files[id].size)continue;
  let sz=0,type='image/jpeg';
  try{const v=await DB.get('p:'+id);
   if(v){ if(typeof v==='string'){sz=Math.round(v.length*0.75); const mm=v.match(/^data:([^;]+)/); if(mm)type=mm[1]}
          else {sz=v.size||0; type=v.type||'image/jpeg'} }}catch(_){}
  registerFile(id,{size:sz,type},{size:sz,type});
  n++;
 }
 if(n)save();
 return n;
}

/* ================= 이미지 최적화 · 중복 제거 ================= */
const QOPT={low:{max:1280,q:0.78,n:'저용량'},std:{max:1600,q:0.82,n:'기본'},high:{max:2048,q:0.86,n:'고화질'}};
let WEBP_OK=null;
function webpOK(){
 if(WEBP_OK!==null)return WEBP_OK;
 try{const c=document.createElement('canvas');c.width=c.height=2;
  WEBP_OK=c.toDataURL('image/webp').indexOf('data:image/webp')===0}catch(_){WEBP_OK=false}
 return WEBP_OK;
}
function imgQ(){return QOPT[S.imgq]||QOPT.std}
/* 이미지 인코딩 — WebP 우선, 미지원이면 JPEG */
function encodeImg(file,opt){
 const o=Object.assign({},imgQ(),opt||{});
 return new Promise(res=>{
  const img=new Image(), fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{
    const sw=img.width, sh=img.height;
    const s=Math.min(1,o.max/Math.max(sw,sh));
    const c=document.createElement('canvas');
    c.width=Math.max(1,sw*s|0); c.height=Math.max(1,sh*s|0);
    const x=c.getContext('2d');
    x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    x.drawImage(img,0,0,c.width,c.height);
    const type=(o.type)||(webpOK()?'image/webp':'image/jpeg');
    c.toBlob(b=>{
      if(!b&&type!=='image/jpeg'){c.toBlob(b2=>res({blob:b2,w:c.width,h:c.height,sw,sh}),'image/jpeg',o.q);return}
      res({blob:b,w:c.width,h:c.height,sw,sh});
    },type,o.q);
   };
   img.onerror=()=>res(null);
   img.src=fr.result};
  fr.onerror=()=>res(null);
  fr.readAsDataURL(file);
 });
}
/* 기존 호출부 호환 */
function resize(file){return encodeImg(file).then(r=>r&&r.blob)}

/* 내용 해시 (같은 사진 두 번 저장 방지) */
async function blobHash(blob){
 try{
  const buf=await blob.arrayBuffer();
  const v=new Uint8Array(buf);
  let h1=0x811c9dc5, h2=0x01000193;
  const step=Math.max(1,Math.floor(v.length/40000));
  for(let i=0;i<v.length;i+=step){
   h1=((h1^v[i])*16777619)>>>0;
   h2=((h2+v[i]*31)^(h2<<5))>>>0;
  }
  return blob.size.toString(36)+'-'+h1.toString(36)+h2.toString(36);
 }catch(_){return null}
}
/* 파일 참조 수 (다른 곳에서 쓰고 있으면 지우지 않는다) */
function fileRefs(id){
 let n=0;
 Object.values(S.days||{}).forEach(d=>(d.photos||[]).forEach(x=>{if(x===id)n++}));
 (S.bucket||[]).forEach(b=>(b.photos||[]).forEach(x=>{if(x===id)n++}));
 (S.body||[]).forEach(r=>{if(r.ph===id)n++});
 return n;
}
/* 어디에서도 쓰지 않는 사진 찾기 */
function orphanFiles(){
 const used=new Set();
 Object.values(S.days||{}).forEach(d=>(d.photos||[]).forEach(x=>used.add(x)));
 (S.bucket||[]).forEach(b=>(b.photos||[]).forEach(x=>used.add(x)));
 (S.body||[]).forEach(r=>{if(r.ph)used.add(r.ph)});
 return Object.values(S.files||{}).filter(m=>m&&!m.deleted_at&&!used.has(m.id));
}
async function cleanOrphans(){
 const L=orphanFiles();
 if(!L.length){toast('정리할 사진이 없어요');return 0}
 for(const m of L){await Storage.del(m.id); delete S.files[m.id]}
 save(); render(); toast(`${L.length}장 정리했어요`);
 return L.length;
}

const GPAPI='https://photospicker.googleapis.com/v1';

    if(!mf.baseUrl){failed++;continue}
    const url=mf.baseUrl+'=w'+q.max+'-h'+q.max;
    const rs=await fetch(url,{headers:{'Authorization':'Bearer '+GPTOKEN}});
    if(!rs.ok){failed++;continue}
    const raw=await rs.blob();
    const enc=await encodeImg(new File([raw],mf.filename||'photo.jpg',{type:raw.type||'image/jpeg'}));
    if(!enc||!enc.blob){failed++;continue}
    const md=mf.mediaFileMetadata||{};
    const id=await Storage.putLocal(enc.blob,null,{
      source:'google_photos', google_media_id:it.id,
      google_session_id:ses.id,
      original_filename:mf.filename||'', original_width:md.width||enc.sw, original_height:md.height||enc.sh,
      taken_at:it.createTime||'', w:enc.w, h:enc.h
    });
    if(Storage.lastDup)dup++; else bytes+=enc.blob.size;
    if(!o.photos.includes(id))o.photos.push(id);
   }catch(_){failed++}
  }
  try{await gpFetch('/sessions/'+encodeURIComponent(ses.id),{method:'DELETE'})}catch(_){}
  GPTOKEN=null; GPSESSION=null;
  save(); render();
  gpPanel('가져오기 완료',
   `<div style="font-size:30px">🎉</div>
    <div class="bs" style="margin-top:12px">
      <div class="b"><span>가져옴</span><b style="color:var(--ok)">${done-failed-dup}장</b></div>
      <div class="b"><span>이미 있음</span><b>${dup}장</b></div>
      <div class="b"><span>실패</span><b style="color:${failed?'var(--warn)':'var(--sub)'}">${failed}장</b></div>
    </div>
    <div style="font-size:11.5px;color:var(--sub);margin-top:10px;font-weight:600">앱에 저장된 용량 ${humanSize(bytes)}</div>`,
   `<button class="btn p" onclick="close_()">확인</button>`);
 }catch(e){
  const m=String(e&&e.message||e);
  if(/Failed to fetch|NetworkError|CORS/i.test(m))
   return gpErr('브라우저에서 Google 사진을 직접 받지 못했어요 (CORS 차단).<br>중계 서버가 필요합니다. 설정 화면 안내를 참고해주세요');
  gpErr('오류: '+m.slice(0,120));
 }
}

  const d=S.days[day]; if(!d)return;
  if(d.wx)out['dm_'+day]={id:'dm_'+day,kind:'daymeta',day,slot:null,data:{wx:d.wx}};
  ['me','you'].forEach(sl=>{const x=(d.diary||{})[sl];
   if(x&&(x.text||x.mood||x.title||(x.tags||[]).length))out[`di_${day}_${sl}`]={id:`di_${day}_${sl}`,kind:'diary',day,slot:sl,
     data:{text:x.text||'',mood:x.mood||null,title:x.title||'',tags:x.tags||[]}}});
  (d.exp||[]).forEach(e=>{if(e&&e.id)out[e.id]={id:e.id,kind:'expense',day,slot:e.by||'me',data:e}});
  ['me','you'].forEach(sl=>{const c=(d.chk||{})[sl]||{};
   const on=Object.keys(c).filter(k=>c[k]);
   if(on.length)out[`ck_${day}_${sl}`]={id:`ck_${day}_${sl}`,kind:'check',day,slot:sl,data:{items:on}}});
  if((d.places||[]).length)out['pp_'+day]={id:'pp_'+day,kind:'places',day,slot:null,data:{list:d.places}};
  (d.photos||[]).forEach(pid=>{out[pid]={id:pid,kind:'photo',day,slot:(fileMeta(pid)||{}).slot||null,data:fileMetaRec(pid)}});
 });
 return out;
}
const sigOf=r=>JSON.stringify(r.data);
/* DB에 넣을 파일 메타데이터 (파일 자체는 넣지 않음) */
function fileMetaRec(id){
 const m=fileMeta(id)||{};
 return {p:m.provider||'supabase',path:m.path||filePath(id),t:m.type||'image/jpeg',
   sz:m.size||0,own:m.slot||'',ca:m.created_at||'',
   src:m.source||'device',gid:m.google_media_id||'',fn:m.original_filename||'',
   ow:m.original_width||0,oh:m.original_height||0,ta:m.taken_at||'',w:m.w||0,h:m.h||0,hs:m.hash||''};
}
function applyFileMeta(id,data){
 if(!data||typeof data!=='object')return;
 if(!S.files)S.files={};
 const m=S.files[id]||{id};
 if(data.p)m.provider=data.p;
 if(data.path)m.path=data.path;
 if(data.t)m.type=data.t;
 if(data.sz)m.size=data.sz;
 if(data.own)m.slot=data.own;
 if(data.ca)m.created_at=data.ca;
 if(data.src)m.source=data.src;
 if(data.gid)m.google_media_id=data.gid;
 if(data.fn)m.original_filename=data.fn;
 if(data.ow)m.original_width=data.ow;
 if(data.oh)m.original_height=data.oh;
 if(data.ta)m.taken_at=data.ta;
 if(data.w)m.w=data.w;
 if(data.h)m.h=data.h;
 if(data.hs){m.hash=data.hs;if(!S.fileHash)S.fileHash={};S.fileHash[data.hs]=id}
 m.up=true; m.deleted_at=null;
 S.files[id]=m;
}

function applyRecord(r){
 if(r.deleted)return removeRecord(r);
 const d=D(r.day);
 if(r.kind==='daymeta')d.wx=(r.data||{}).wx||null;
 else if(r.kind==='diary'){d.diary[r.slot]=d.diary[r.slot]||{};d.diary[r.slot].text=r.data.text||'';d.diary[r.slot].mood=r.data.mood||null;
   d.diary[r.slot].title=r.data.title||'';d.diary[r.slot].tags=r.data.tags||[]}
 else if(r.kind==='expense'){const e=Object.assign({},r.data);e.id=r.id;
  const i=d.exp.findIndex(x=>x.id===r.id); if(i>=0)d.exp[i]=e; else d.exp.push(e)}
 else if(r.kind==='check'){const set={};(r.data.items||[]).forEach(k=>set[k]=true);d.chk[r.slot]=set}
 else if(r.kind==='places')d.places=r.data.list||[];
 else if(r.kind==='photo'){if(!d.photos.includes(r.id))d.photos.push(r.id);
   applyFileMeta(r.id,r.data);PHOTO_WANT.add(r.id)}
}
function removeRecord(r){
 const d=S.days[r.day]; if(!d)return;
 if(r.kind==='expense')d.exp=(d.exp||[]).filter(x=>x.id!==r.id);
 else if(r.kind==='photo')d.photos=(d.photos||[]).filter(x=>x!==r.id);
 else if(r.kind==='diary'){if(d.diary[r.slot])d.diary[r.slot]={}}
 else if(r.kind==='daymeta')d.wx=null;
 else if(r.kind==='check')d.chk[r.slot]={};
 else if(r.kind==='places')d.places=[];
}
const SETKEYS=['names','since','checkItems','cats','incomeCats','pay','budget','favPlaces',
 'events','anniv','tasks','shop','goals','memos','trips','fixed','bucket','body','loc','placeMeta','photoMeta','tags','tagStats','settle','storage','imgq','gphotos'];
function pickSettings(){const o={};SETKEYS.forEach(k=>o[k]=S[k]);return o}
function applySettings(o){if(!o)return;SETKEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]})}

/* ---- 사진 ---- */
async function blobOf(id){
 const v=await DB.get('p:'+id); if(!v)return null;
 if(typeof v!=='string')return v;
 const res=await fetch(v); return await res.blob();
}
async function pullPhoto(id){
 try{return await Storage.pull(id)}catch(_){return false}
}

/* ---- 동기화 ---- */
async function syncNow(manual){
 if(SYNCING)return;
 if(!SB){const ok=await initSB();if(!ok){if(manual)toast(SYNCERR||'연결 준비 실패');return}}
 if(!SESS){if(manual)toast('먼저 로그인해주세요');return}
 if(!S.sync||!S.sync.spaceId){if(manual)toast('공간을 먼저 만들거나 합류해주세요');return}
 SYNCING=true;SYNCERR='';paintSync();
 const sid=S.sync.spaceId;
 try{
  /* 1) 받기 */
  const since=S.sync.cursor||'1970-01-01T00:00:00Z';
  const {data:rows,error:e1}=await SB.from('records').select('*').eq('space_id',sid).gt('updated_at',since).order('updated_at',{ascending:true}).limit(2000);
  if(e1)throw e1;
  (rows||[]).forEach(r=>{applyRecord(r);S.sync.sig[r.id]={s:r.deleted?'DEL':sigOf(r),kind:r.kind,day:r.day,slot:r.slot}});
  if(rows&&rows.length)S.sync.cursor=rows[rows.length-1].updated_at;

  const {data:sp,error:e2}=await SB.from('spaces').select('settings,updated_at,code').eq('id',sid).maybeSingle();
  if(e2)throw e2;
  if(sp){
   S.sync.code=sp.code;
   if(sp.updated_at&&sp.updated_at!==S.sync.setCursor&&sp.settings&&Object.keys(sp.settings).length){
    applySettings(sp.settings);S.sync.setCursor=sp.updated_at;S.sync.setSig=JSON.stringify(pickSettings());
   }
  }

  /* 2) 보내기 */
  const cur=buildRecords(), ups=[], now=new Date().toISOString();
  Object.values(cur).forEach(r=>{
   const old=S.sync.sig[r.id];
   if(!old||old.s!==sigOf(r))ups.push({id:r.id,space_id:sid,kind:r.kind,day:r.day,slot:r.slot,data:r.data,deleted:false,deleted_at:null,updated_at:now});
  });
  Object.keys(S.sync.sig).forEach(id=>{
   const m=S.sync.sig[id];
   if(!cur[id]&&m&&m.s!=='DEL')ups.push({id,space_id:sid,kind:m.kind,day:m.day,slot:m.slot,data:{},deleted:true,deleted_at:now,updated_at:now});
  });
  /* 사진 먼저 올리기 (Storage 계층 경유) */
  for(const r of ups.filter(x=>x.kind==='photo'&&!x.deleted)){
   try{await Storage.push(r.id)}catch(_){}
   r.data=fileMetaRec(r.id);
  }
  for(let i=0;i<ups.length;i+=100){
   const chunk=ups.slice(i,i+100);
   const {error:e3}=await SB.from('records').upsert(chunk,{onConflict:'id'});
   if(e3)throw e3;
   chunk.forEach(r=>{S.sync.sig[r.id]={s:r.deleted?'DEL':JSON.stringify(r.data),kind:r.kind,day:r.day,slot:r.slot}});
  }
  /* 설정 보내기 */
  const setSig=JSON.stringify(pickSettings());
  if(setSig!==S.sync.setSig){
   const {data:sp2,error:e4}=await SB.from('spaces').update({settings:pickSettings(),updated_at:now}).eq('id',sid).select('updated_at').maybeSingle();
   if(e4)throw e4;
   S.sync.setSig=setSig; if(sp2)S.sync.setCursor=sp2.updated_at;
  }
  /* 3) 없는 사진 내려받기 */
  let n=0;
  for(const id of Array.from(PHOTO_WANT)){
   if(n>=20)break;
   const has=await DB.get('p:'+id);
   if(!has){await pullPhoto(id);n++}
   PHOTO_WANT.delete(id);
  }
  S.sync.last=new Date().toISOString();
  save();
  SYNCING=false;paintSync();
  if(rows&&rows.length)safeRender();
  if(manual)toast('동기화 완료');
 }catch(e){
  SYNCING=false;SYNCERR=String((e&&(e.message||e.error_description))||e);paintSync();
  if(manual)toast('동기화 실패: '+SYNCERR.slice(0,40));
 }
}
let syncT=null;
function syncSoon(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(()=>{if(typing()){syncSoon();return}syncNow(false)},2500)}
function paintSync(){
 const el=document.getElementById('syncdot'); if(!el)return;
 el.style.display=syncOn()?'block':'none';
 el.style.background=SYNCING?'#F6A96B':SYNCERR?'var(--warn)':'var(--ok)';
}

async function doSignup(){
 const e=document.getElementById('au_e').value.trim(), p=document.getElementById('au_p').value;
 if(!e||p.length<6)return toast('이메일과 6자 이상 비밀번호를 입력해주세요');
 if(!SB&&!(await initSB()))return toast(SYNCERR||'연결 준비 실패');
 SYNCERR='';
 const {data,error}=await SB.auth.signUp({email:e,password:p});
 if(error){SYNCERR=error.message;render();return toast('가입 실패')}
 if(!data.session){SYNCERR='메일 인증이 켜져 있습니다. Supabase 설정에서 Confirm email을 꺼주세요.';render();return}
 SESS=data.session;S.sync.email=e;save();render();toast('가입 완료');
}
async function doLogin(){
 const e=document.getElementById('au_e').value.trim(), p=document.getElementById('au_p').value;
 if(!e||!p)return toast('이메일과 비밀번호를 입력해주세요');
 if(!SB&&!(await initSB()))return toast(SYNCERR||'연결 준비 실패');
 SYNCERR='';
 const {data,error}=await SB.auth.signInWithPassword({email:e,password:p});
 if(error){SYNCERR=error.message;render();return toast('로그인 실패')}
 SESS=data.session;S.sync.email=e;save();render();toast('로그인 완료');
 if(S.sync.spaceId)syncNow(true);
}
async function doLogout(){
 try{await SB.auth.signOut()}catch(_){}
 SESS=null;SYNCERR='';render();toast('로그아웃했어요');
}
function randCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function doCreateSpace(){
 SYNCERR='';
 const code=randCode();
 const {data,error}=await SB.rpc('create_space',{p_code:code});
 if(error){SYNCERR=error.message;render();return toast('만들기 실패')}
 S.sync.spaceId=data;S.sync.code=code;S.sync.slot='me';S.sync.cursor=null;S.sync.sig={};S.sync.setSig='';
 S.profile='me';rebaseFiles(data);save();render();toast('공간을 만들었어요');
 syncNow(true);
}
async function doJoinSpace(){
 SYNCERR='';
 const c=(document.getElementById('sp_code').value||'').trim().toUpperCase();
 if(c.length<4)return toast('초대코드를 입력해주세요');
 const {data,error}=await SB.rpc('join_space',{p_code:c});
 if(error){
  SYNCERR=error.message.includes('CODE_NOT_FOUND')?'그런 초대코드가 없어요':
          error.message.includes('SPACE_FULL')?'이미 두 명이 차 있어요':error.message;
  render();return toast('합류 실패')}
 S.sync.spaceId=data;S.sync.code=c;S.sync.slot='you';S.sync.cursor=null;S.sync.sig={};S.sync.setSig='';
 S.profile='you';rebaseFiles(data);save();render();toast('합류했어요');
 syncNow(true);
}
